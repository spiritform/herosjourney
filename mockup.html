     the neighbour, so hover could only light three sides. Give it one back
     and pull it over the neighbour, so the strip does not grow by a pixel. */
  /* HOVER IS A TINT, NOT AN OUTLINE - Babe, 2026-10-25: "maybe its a
     tint/opacity thing when it should be a color, that way you can overlap
     them and change the color instead of the outline". The cells share their
     borders, so lighting the outline meant GIVING a hovered cell a left
     border it did not have and pulling it a pixel over its neighbour to stop
     the strip growing - and that is what put a line on DUR, which has no
     hover state at all, and what made every cell's left edge trail the
     pointer as one faded up while the last faded down. A wash over the cell
     needs none of it: the cells can overlap, the dividers never move, and
     the thing that changes is the cell rather than the seam between two of
     them. */
  /* THE SAME SIZE AS A TRAY CELL - Babe, 2026-10-25: "should we make the text
     buttons below the same size, so the models match in style". The rung now
     names a model in two places, the panel's tray and this row, and at 12px
     against 13.5px the same fact was wearing two sizes. The cells are measured
     in `ch` at render time, so the row's widths follow the type rather than
     needing to be re-measured by hand. */
  .param {
    font-family: var(--mono); font-size: var(--btn-f); letter-spacing: .05em;
    border: 1px solid var(--edge); color: var(--sand-dim);
    height: var(--ctl-h); padding: 0 10px; background: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    /* THE DIVIDERS DO NOT EASE. Babe, 2026-10-25: "its a little weird that
       all of them sort of have a delay on the left line". Hovering a cell
       gives it a left border it did not have, and `border-color` was on the
       same .18s as the text - so the new edge faded up while the one you had
       just left faded down, and the lines trailed the pointer along the row.
       The borders here are structure, the same as every other divider on
       this page; only what they say has a state. */
    /* THE HOVER STROKE IS AN OUTLINE AT -1px, WHICH LANDS EXACTLY ON THE
       BORDER. Three versions to get here. A border could not do it: the
       cells share their dividers, so lighting one meant GIVING the hovered
       cell a left edge and pulling it a pixel over its neighbour - that is
       what marked DUR and what made the seams trail the pointer. An inset
       shadow fixed the layout and looked CLUNKY for a reason: it draws
       inboard of the cell's own 1px border, so three sides came back
       doubled. An outline takes no space either AND `outline-offset: -1px`
       puts it on top of the border rather than beside it, so one line
       changes colour and nothing is added anywhere.
       AND IT EASES. Babe, 2026-10-25: "its unique but not as smooth", "prob
       because it just pops on" - it popped because I had made it instant to
       dodge the old lag. That lag was two cells cross-fading ONE shared
       border; this outline belongs to the cell it is on, so a fade is just
       this cell's own stroke coming up. */
    outline: 1px solid transparent; outline-offset: -1px;
    transition: color .18s, background .14s, outline-color .14s;
  }
  /* THE TINT WON, AND IT WAS A RULE THIS PAGE ALREADY HELD. Both were built
     and looked at side by side, 2026-10-25; Babe: *"the outline might feel
     more clunky actually"*, which it is, for a reason worth keeping: on a
     strip whose cells SHARE their dividers, an inset stroke draws a second
     line a pixel inboard of the first, so every seam doubles on hover. And
     this page decided once already that **the lines are structure and do not
     have a state** - that is why a disabled tray cell dims its text instead
     of fading the divider it carries. A wash fills the cell, which is the
     thing you are pointing at, and leaves the seams alone.
     The stroke version, if it is ever wanted back:
       box-shadow: inset 0 0 0 1px var(--sand-dim);
     - no space, no margin, no z-index, and instant, because the weird part
     was never the stroke but `border-color` easing underneath it. */
  .param:not([data-read="1"]):hover { color: var(--sand); outline-color: var(--sand-dim); }
  /* the tint, one line, for flipping back: swap which of these is commented.
     .param:not([data-read="1"]):hover { color: var(--sand); background: var(--btn-tint); } */
  /* SOUND IS A SPEAKER - Babe, 2026-10-25: "sound keep is just an audio icon
     toggle". KEEP/DROP is a two-state thing and the row is short of room, so
     the cell carries the state as a picture and keeps the word only for the
     code to read. `data-v` is written by the same cycle that writes the
     value, so the glyph cannot disagree with what gets sent. The mask takes
     `currentColor`, so the icon dims and lights with the cell like any text
     in it would. */
  .param[data-p="sound"] { padding: 0 12px; }
  .param[data-p="sound"] b { display: none; }
  .snd {
    width: 15px; height: 15px; background: currentColor;
    -webkit-mask: center/contain no-repeat; mask: center/contain no-repeat;
  }
  .param[data-v="KEEP"] .snd {
    -webkit-mask-image: var(--snd-on); mask-image: var(--snd-on);
  }
  .param[data-v="DROP"] .snd {
    -webkit-mask-image: var(--snd-off); mask-image: var(--snd-off);
  }
  /* a readout is not a control: it does not light up and it is not pressable */
  .param[data-read="1"] { cursor: default; }
  .param b {
    color: var(--sand-mid); font-weight: 400;
    display: inline-block; text-align: center;
  }
  /* a locked seed is the one you chose; an unlocked one is just the last one
     that happened. */
  /* A SEED IS A DIFFERENT LENGTH EVERY TIME, and it is written from the
     submit response while the clock is running - so the cell beside RUN was
     resizing mid-run for the same reason RUN was. Ten digits is the widest a
     seed gets. */
  /* AND IT IS THE LAST CELL IN THE STRIP, so the only thing to its right is
     the strip's own edge - Babe, 2026-10-26: "can you add more space on the
     right of the seed value?". A ten-digit number in a 10ch box leaves the
     cell's 10px and nothing else, and a value pressed against a border reads
     as clipped. Every other cell in this row has a neighbour's divider to
     breathe against; this one has the end of the row. */
  .param[data-p="seed"] b { min-width: 10ch; }
  .param[data-p="seed"] { padding-right: 18px; }
  .param[data-p="seed"][data-lock="0"] b { color: var(--edge-lit); }
  /* THE NUMBER IS THE LOCK, NOT A RULE UNDER IT - Babe, 2026-10-25: "for
     seed lock instead of the red line just make the seed number red or
     something else". The rule was a second mark for one state, drawn on the
     cell's own edge where every other cell in this row carries its divider,
     so a locked seed read as a cell with something wrong with it. The thing
     you locked is the number; the number says so. */
  .param[data-p="seed"][data-lock="1"] { color: var(--sand-mid); }
  .param[data-p="seed"][data-lock="1"] b { color: var(--red); }
  .param { position: relative; }
  .param:focus-visible { outline: 1px solid var(--red); outline-offset: 2px; }

  /* the model is the head of the same row, not a line of prose somewhere else */
  /* THE WIDTH IS A FLOOR, NOT A FIT. It keeps the trigger from resizing as
   you pick a different model, which would shove SECONDS and SEED sideways -
   same reason every value box is sized in `ch`. It was 312px when each menu
   row also carried a time on the right; that column is gone, so the floor
   came down with it. */
  .model-wrap { position: relative; display: inline-flex; min-width: 232px; }
  .param.model { border-color: var(--edge-lit); padding: 0 12px; flex: 1 1 auto; }
  .param.model b { color: var(--sand); font-weight: 400; letter-spacing: .08em; }
  .param.model.solo { cursor: default; }
  .param.model.solo .caret { display: none; }
  .param.model .caret {
    color: var(--red); font-size: 11px; line-height: 1;
    transition: transform .2s; margin-right: 2px;
  }
  .model-wrap.is-open .param.model { border-color: var(--sand-dim); color: var(--sand); }
  .model-wrap.is-open .caret { transform: rotate(180deg); }

  /* Opens DOWNWARD and welded to the trigger: the row you are on stays where
     it is and the alternatives drop out from under it, sharing its border the
     way a slot tray does. */
  /* THE ROWS DECIDE THE WIDTH AND THE TRIGGER IS THE FLOOR - Babe,
     2026-10-27: "getting some side scrolling in the model dropdown". It was
     pinned `left: 0; right: 0` to the trigger, and a row carries a name plus
     its receipt word, so `QWEN-IMAGE-21-TURBO (local)` is wider than
     `MODEL : QWEN-IMAGE-EDIT-21`. THE SCROLLBAR WAS NOT ASKED FOR: once one
     axis is not `visible`, the other computes from `visible` to `auto`, so
     `overflow-y: auto` for the 148px cap quietly bought a horizontal bar on
     the other axis the moment anything was too wide. Same construction as
     the result panel's foot, the other way round - there the picture decides
     and the strip gives, here the longest row decides and the trigger is the
     minimum. It grows rightwards over the param cells, which is where a menu
     drawn above them belongs. */
  .model-menu {
    position: absolute; left: 0; right: auto; width: max-content;
    min-width: 100%; top: calc(100% - 1px); z-index: 6;
    background: rgba(8,9,10,.98);
    border: 1px solid var(--edge-lit); border-top: 0;
    display: none; flex-direction: column;
    max-height: 148px; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: var(--edge-lit) transparent;
  }
  .model-menu::-webkit-scrollbar { width: 8px; }
  .model-menu::-webkit-scrollbar-track { background: transparent; }
  .model-menu::-webkit-scrollbar-thumb { background: var(--edge-lit); }
  .model-menu::-webkit-scrollbar-thumb:hover { background: var(--sand-dim); }
  .model-wrap.is-open .model-menu { display: flex; }
  .model-wrap.is-up .model-menu {
    top: auto; bottom: calc(100% - 1px);
    border-top: 1px solid var(--edge-lit); border-bottom: 0;
  }
  /* The receipt sits on FORE, which paints over MID, so it would lie on top
     of the menu. Step it out of the way while you are choosing — it is about
     to change anyway. */
  .cost { transition: opacity .18s; }
  .slide:has(.model-wrap.is-open) .cost { opacity: 0; }
  .mm {
    font-family: var(--mono); font-size: 13.5px; letter-spacing: .05em;
    background: none; border: 0; border-bottom: 1px solid var(--edge);
    color: var(--sand-dim); padding: 10px 15px; cursor: pointer; text-align: left;
    display: flex; justify-content: space-between; align-items: center; gap: 18px;
    white-space: nowrap; transition: color .15s, background .15s;
  }
  .mm:last-child { border-bottom: 0; }
  .mm:hover { color: var(--sand); background: rgba(237,225,211,.045); }
  /* THE ROW YOU ARE ON IS ALREADY ON THE TRIGGER. Showing it again in the
     menu reads as two models, so the menu holds only the alternatives. */
  .mm[aria-pressed="true"] { display: none; }
  /* AND A ROW THAT DOES ONE JOB IS NOT THERE WHERE THAT JOB IS NOT - see
     markOnly. The pressed row hides the same way, so this is the menu's own
     idiom rather than a second way of taking a row out of it. */
  .mm.off { display: none; }
  /* and a tray cell for a face the chosen model has no address for */
  .tray .tr.off { display: none; }
  .mm span { display: inline-flex; align-items: baseline; gap: 7px; }
  .mm u { text-decoration: none; color: var(--sand-dim); }
  .mm u.is-partner { color: var(--red); }

  .run {
    font-family: var(--ui); font-size: 14px; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase;
    background: var(--red); color: var(--sand); border: 1px solid var(--red);
    height: var(--ctl-h); padding: 0 34px; cursor: pointer; white-space: nowrap;
    /* the flash is an absolutely positioned child of this */
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    transition: filter .18s;
    /* AND IT HOLDS ITS WIDTH WHILE IT IS THE CLOCK - Babe, 2026-10-26: "when
       you press run there is like a scal shift or something as the numbers
       appear / change". RUN becomes the timer on a press, so the label goes
       from three characters to five and back, and this button is the fixed
       end of a row whose other end is `flex: 1 1 auto` - the params strip
       gave up the difference and every cell in it moved. Twice a second.
       SIX CHARACTERS IS THE WIDEST IT COUNTS TO, which is the same trick the
       param row already uses on its own cells: size to the widest thing the
       box can hold, so what changes is the text and never the furniture.
       (`Not wired` is wider and still expands it - that is a state the page
       settles out of before anyone presses anything.)
       AND IT IS `em`, NOT `ch`, WHICH IS THE HALF THAT WAS STILL MOVING.
       `ch` is the width of a `0` in the element's OWN font, and the clock
       state swaps Archivo for the mono stack - so one declaration resolved to
       two different widths and the button still stepped on the press, by the
       difference between the two fonts' digits. `em` is font-SIZE relative
       and the family cannot move it. 3.6em is 6 monospace characters at the
       0.6em advance every font in that stack uses, so the width is the one
       the clock already had and the rest state comes up to meet it. */
    min-width: calc(3.6em + 68px);
  }
  .run:hover { filter: brightness(1.14); }
  /* A FLASH TO CROSS THE SWAP - Babe, 2026-10-26: "maybe when you press it we
     have like a flash overlay so its not just an abrupt text change". RUN
     becomes the clock on the press, and holding the width only stopped the
     furniture moving - the label still cut from a word to a number with
     nothing between the two. The flash lands with the class, so the swap
     happens behind it.
     IT IS A CHILD, NOT A FILTER OR A BACKGROUND. A filter would make this
     button a containing block, and the background is the accent - the one
     colour on the row that means "this is the thing to press". */
  .run.is-running::after {
    content: ''; position: absolute; inset: 0;
    background: var(--sand); pointer-events: none;
    animation: runflash .3s cubic-bezier(.2, 0, .4, 1) forwards;
  }
  @keyframes runflash { from { opacity: .92; } to { opacity: 0; } }
  /* ONE STEP AT A TIME, AND THE BUTTONS SAY WHICH ONE - Babe, 2026-10-25:
     "make the bigger workflow run dimmed out, since you have to finish these
     steps first and then it highlights orange when you are at that step".
     04 is two generations and the second cannot be the first: without a board
     the rung would quietly run as a one-reference job, which looks like it
     worked. So the rung's RUN is cold until the panel has drawn one, and the
     accent moves from the panel to the rung as the step does - the row of
     lit buttons is the order of the work. It is unpressable rather than just
     dim, because a button that looks spent and still fires is worse than
     either. */
  /* SCOPED TO THE RUNG'S OWN RUN, and that matters: `.run` is also the class
     the result panel gives its primary button, so an unscoped rule here made
     CONTINUE JOURNEY transparent and unpressable on 04 while the board was
     missing - a gate on one button silently disabling another. */
  /* AND THE SAME WHILE A SLOT IS WRITING ITS OWN PROMPT - Babe, 2026-10-25:
     "both runs are red too". The PROMPT face has a RUN of its own, because
     the sentence you are typing is a job this slot runs, and 01 was drawing
     that one and the rung's one in the same accent at the same moment. Two
     red buttons six inches apart, doing different things, with nothing
     saying which is which.
     THE ACCENT WALKS THE RUNG, which is already the rule on 04 and is the
     same situation: a step inside a slot comes before the rung's own step,
     so the lit button is the one that is next. Stepping back out of the
     face hands it back. Unpressable rather than just dim, for the reason
     below - and scoped to the rung's own RUN for the reason below that. */
  /* AND A RUN WITH NO PROMPT IS NOT A RUN. Every rung requires one, so a
     cleared line used to travel to the server and come back as an error
     modal over the panel. Same gate, same reason: the lit button is the one
     that is next, and with the line empty the next thing is typing in it. */
  /* A WRITING FACE THAT IS THE RUNG'S OWN PROMPT IS NOT A STEP BEFORE IT.
     `.writes` is the slot saying the words in it are what RUN sends, so the
     rung's button stays lit while you type - and goes cold on the empty box
     instead, which is the same gate one level in. */
  /* AND A WORDS SLOT IS THE SAME GATE ONE MORE LEVEL OUT. It used to read
     `.has-form:not(.has-board)`, which held 04's RUN cold until the panel's
     own RUN had drawn a board - a rule that existed because the rung had two
     buttons. With one, the rung's RUN is what draws it, so what has to be
     there first is the direction, not the drawing. 05 is gated by the same
     selector for the same reason: its box IS its prompt. */
  /* AND A MODE THAT CANNOT RUN WITHOUT WORDS IS COLD UNTIL THERE ARE SOME,
     with the box closed as well as open. The `.ask` only exists while you
     are writing; once it closes, the words are on the box as `data-said` -
     absent if there have never been any, empty if they were cleared. */
  .slide:has(.slot.is-asking:not(.writes)) .mid-col .row > .run,
  .slide:has(.slot.writes .ask:empty) .mid-col .row > .run,
  .slide:has(.slot.writes.needs-words:not(.is-asking) .drop:not([data-said])) .mid-col .row > .run,
  .slide:has(.slot.writes.needs-words:not(.is-asking) .drop[data-said=""]) .mid-col .row > .run,
  /* AND NOTHING AT ALL IS NOT A JOB - Babe, 2026-10-26: "i wonder if we
     should keep run empty until the prompt appears there". A writing slot
     with no picture AND no words has answered nothing, and STYLE's `blankTo`
     made it look answered: the floor sentence is `become the character in the
     reference`, which is a real job when there IS a reference and a sentence
     addressed to nobody when there is not.
     A PICTURE ALONE IS STILL A JOB, which is why this is `:not(.is-full)` and
     not a words test - import a reference, write nothing, and the floor
     sentence has something to point at. The pair above is EDIT's, where words
     are required even with a picture; this one is every writing slot's. */
  .slide:has(.slot.writes:not(.is-full):not(.is-asking) .drop:not([data-said])) .mid-col .row > .run,
  .slide:has(.slot.writes:not(.is-full):not(.is-asking) .drop[data-said=""]) .mid-col .row > .run,
  .slide:has(.agent-v:empty) .mid-col .row > .run,
  .slide:has(.say:empty) .mid-col .row > .run {
    background: transparent; border-color: var(--edge);
    color: var(--sand-dim); cursor: default; pointer-events: none;
  }
  .run:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }

  /* ================= FORE ================= */
  .fore-col {
    position: absolute; left: var(--gut); top: 0; bottom: 0; width: 34%;
    display: flex; flex-direction: column; justify-content: space-between;
    /* THE TWO ENDS ARE TWO KNOBS, which `space-between` gives for free: the
       top padding places the first call-out and the bottom one places the
       last, so they can be nudged apart without a wrapper or an offset on
       either. Babe, 2026-10-25: "move the top call out up by like 2 px...
       and then the bottom one up too", "i think its like 28px up?", then
       the top one back down one: "move the top one down just 1 px".
       The bottom is
       aiming at the underside of the model row across the page, which is the
       lowest edge the panel draws. 6vh is still the measure; these are the
       optical corrections to it. */
    padding-top: var(--rim-y);
    padding-bottom: var(--rim-y);
    pointer-events: none;
  }
  .call {
    font-size: var(--call-f); font-weight: 400; letter-spacing: .14em; text-transform: uppercase;
    color: var(--sand-mid); line-height: 1.5; max-width: 38ch; margin: 0;
  }
  /* ONE COLOUR, TWO WEIGHTS - Babe, 2026-10-25: "can we see what this text
     looks like all the same greyish color you have there, so now grey and
     white. same with the bottom one". The bold half was also lifted to
     --sand (near white) against the lead's --sand-mid, so the line carried
     two marks for one emphasis. The weight already says which half is the
     claim; the second colour was saying it again, louder, on the plane that
     is meant to be an annotation. Both call-outs are .call, so this is one
     rule rather than a change per section. */
  .call b { font-weight: 600; }
  .call .ar { color: var(--red); }

  .call-c {
    position: absolute; right: var(--gut); top: 6vh; width: var(--panel-w);
    font-size: var(--call-f); letter-spacing: .14em; text-transform: uppercase;
    color: var(--sand-mid); pointer-events: none;
  }
  .call-c .ar { color: var(--red); }
  .cost {
    position: absolute; right: var(--gut); bottom: 6vh; width: var(--panel-w);
    font-family: var(--mono); font-size: 12px; letter-spacing: .04em;
    color: var(--sand-dim); pointer-events: none;
    /* HIDDEN, NOT REMOVED. The receipt still updates with the model pick, so
       it is one line away if that slot finds a better use. */
    display: none;
  }
  .tick {
    position: absolute; right: var(--gut); top: 6vh;
    font-family: var(--mono); font-size: 12px; letter-spacing: .18em;
    color: var(--red); text-align: right; pointer-events: none;
  }

  /* ================= top bar ================= */
  /* THE PAGE WAITS HIDDEN UNTIL intro() BUILDS IT IN, the way dwarp's does -
     Babe, 2026-10-25, pointing at it: "basically kind of what i did with
     dwarp", "animejs it". Without this the whole page paints, then jumps to
     opacity 0, then cascades, which is a flash of the ending before the
     beginning. `visibility` rather than `display` so nothing reflows when it
     comes back, and it is on the two roots rather than on every target.
     IT IS REMOVED BEFORE THE FIRST FRAME OF THE CASCADE, not after - the
     targets are already sitting at opacity 0 by then. */
  body.intro .topbar, body.intro .stage { visibility: hidden; }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 70;
    height: var(--lb-top); background: var(--ink);
    border-bottom: 1px solid #1a1817;
    display: flex; align-items: center; justify-content: space-between;
    /* THE BAR IS INSET BY THE SAME AMOUNT ON ALL FOUR SIDES - Babe,
       2026-10-25: "can we tuck heroes journey and the arrows closer to the
       edges, so its the same spacing on the top and bottom on the sides".
       It was 3vw at the sides against 17px above and below, so the lockup
       and the arrows floated a long way in from edges they were supposed to
       be sitting against - and at 1745 wide that is 52px against 17.
       THE ARROWS ARE WHAT MAKES IT MEASURABLE: they are the only thing in
       the bar with a box of its own, so the gap above and below one of them
       IS the bar inset. Derived rather than typed, so the four sides stay
       equal if the bar height or the button ever changes. */
    gap: 20px; padding: 0 calc((var(--lb-top) - var(--ar-h)) / 2);
  }
  /* THE LOCKUP IS LIGHT, THE NAV IS NOT - Babe, 2026-10-26: "can we see what
     HERO'S JOURNEY looks like in a lighter condensed typeface?", and the
     reason under it: "im not sure if i like that its close to the section
     headers but just spread apart. but i do like that its spread apart".
     WHICH IS THE WHOLE DIAGNOSIS. The lockup and the nav were the same face
     at the same size one weight apart - 600 against 500 - so the only thing
     telling them apart was the tracking, and a wordmark that is a nav item
     with gaps in it is not a wordmark. The tracking stays (it earns it, and
     Babe likes it); the WEIGHT is what carries the difference now, 200
     against the nav's 500. Two steps of the same scale rather than one.
     300, NOT 200 - Babe, 2026-10-26: "i think it might be too light now
     actually". At 200 a 15px condensed face spread to .24em is hairline: the
     strokes thin out faster than the gaps close, so the wordmark started
     dissolving rather than reading as quiet. 300 still sits two steps under
     the nav and holds its own line.
     STILL OSWALD, because the condensed face is what makes .24em readable at
     all - a wide face spread that far comes apart into letters. */
  /* THE LOCKUP SITS WITH THE NAV, NOT ABOVE IT - Babe, 2026-10-27: "can you
     make heros journey logo a little thicker and try that unselected
     tan/grey color". It was 300 at the bar's full sand, which made the one
     thing in the bar you never press the brightest thing in it. At
     `--sand-dim` it reads as a name rather than as a destination, and the
     section you are on stays the only lit word up there.
     400 AND NOT 500, WHICH IS THE NAV'S OWN WEIGHT: same colour and same
     weight would make the lockup a seventh tab. One step thicker is enough
     to hold the wider tracking - .24em at 300 was thin enough to break up. */
  .mark {
    font-family: var(--label);
    font-size: 15px; font-weight: 400; letter-spacing: .24em; text-transform: uppercase;
    white-space: nowrap; flex: 0 0 auto; color: var(--sand-dim);
  }

  /* the nav stretches the full bar so a tab's underline lands ON the bar's
     own grey rule rather than floating above it. */
  .nav { display: flex; align-self: stretch; align-items: stretch; gap: 14px; flex: 0 1 auto; min-width: 0; }
  .ck {
    position: relative;
    display: flex; align-items: center;
    font-family: var(--label);
    font-size: 15px; font-weight: 500; letter-spacing: 0; text-transform: uppercase;
    background: none; border: 0;
    color: var(--sand-dim); padding: 6px 13px; cursor: pointer; white-space: nowrap;
    transition: color .25s;
  }
  /* inset by the padding, so the rule is exactly as wide as the label */
  .ck::after {
    content: ''; position: absolute; left: 13px; right: 13px; bottom: 2px; height: 3px;
    background: var(--red); opacity: 0; transition: opacity .25s;
  }
  @media (max-width: 1500px) { .ck { font-size: 13px; padding: 6px 10px; }
    .ck::after { left: 10px; right: 10px; } }
  .ck:hover { color: var(--sand); }
  .ck[aria-current="true"] { color: var(--sand); }
  .ck[aria-current="true"]::after { opacity: 1; }
  .ck:focus-visible { outline: 1px solid var(--red); outline-offset: 2px; }

  .right-end { display: flex; align-items: center; gap: 18px; flex: 0 0 auto; }

  /* EVERY SHOT YOU HAVE MADE, ONE PRESS FROM ANYWHERE - Babe, 2026-10-25:
     "there's no like assets / output to see your session generations. maybe
     its an icon in the top right by the arrows?". The rail is already a
     gallery of a kind - each section stands in the room it made - but it
     only ever shows the LATEST per section, so every reroll was somewhere
     you could not get back to.
     IT IS THE SAME SIZE AND BORDER AS AN ARROW, because it belongs to the
     same group: things that move you somewhere without changing anything. */
  /* ONE CONSTRUCTION FOR A GLYPH IN THE BAR. The key button is the film
     strip's twin and says so by sharing its rules rather than by carrying a
     copy of them 34px wide. */
  /* AND THE ONE THAT IS DOING SOMETHING COMES FORWARD - Babe, 2026-10-27:
     "i noticed the right side of the media button stroke is not correct we
     had to design this differently on the model rail". The pair overlaps by
     the seam so each cell keeps four edges, and the key is later in the
     markup - so its LEFT border paints on top of the film strip's RIGHT one.
     While both rest at `--edge` that is invisible and correct; the moment the
     film strip lights its border, or fills sand because the panel is open,
     the one edge it shares is still being drawn by its neighbour and the box
     reads as open on that side.
     A STACKING ORDER IS THE WHOLE FIX HERE, where the param row needed an
     outline: those cells share a border, these two overlap theirs. The cell
     with something to say paints above the other for as long as it is saying
     it, and the seam goes back to being structural the moment it stops. */
  .shots-btn, .key-btn {
    background: none; border: 1px solid var(--edge); color: var(--sand-dim);
    width: 34px; height: var(--ar-h); cursor: pointer; padding: 0;
    display: grid; place-items: center; position: relative;
    transition: color .2s, border-color .2s;
  }
  .shots-btn:hover, .key-btn:hover,
  .shots-btn[aria-pressed="true"], .key-btn.is-missing { z-index: 1; }
  .shots-btn:hover, .key-btn:hover { color: var(--sand); border-color: var(--edge-lit); }
  .key-btn i {
    display: block; width: 18px; height: 16px; background: currentColor;
    -webkit-mask: var(--keyi) center / contain no-repeat;
    mask: var(--keyi) center / contain no-repeat;
  }
  /* WITH NO KEY THIS IS THE ONE THING STOPPING EVERYTHING, so it is the one
     thing in the bar wearing the accent - the same argument an empty slot
     makes for resting at --sand-dim rather than at the colour of a seam.
     It goes quiet the moment there is a key: a button that goes on shouting
     after it has been answered is a button people learn to ignore.
     IT IS A STATE READ OFF /api/health AND NEVER OFF WHAT THE PAGE
     REMEMBERS, because the key lives on the server and the one thing that
     knows is the thing that has it.
     AND THE STATE IS AN OUTLINE, NOT A BORDER, now that this cell shares its
     left edge with the gallery. A border-color would have left the red box
     open on the side it gave up, and giving it back would push the pair a
     pixel wider. An outline at -1px takes no space and draws on top of the
     cell's own border, so one line changes colour and the seam stays
     structural - the same answer the param row's hover arrived at after four
     tries. */
  .key-btn.is-missing { color: var(--red); outline: 1px solid var(--red); outline-offset: -1px; }
  .key-btn.is-missing:hover { color: var(--sand); outline-color: var(--sand); }
  /* A BUTTON THAT OPENS SOMETHING STAYS DOWN WHILE IT IS OPEN - Babe,
     2026-10-25: "when you press the media icon can you keep it toggled on /
     highlight". It wears the same pressed state every other on/off cell in
     this app wears - PRESET, CHARACTER, the mode tabs - which is a sand fill
     and ink on top, rather than a fifth way of saying the same thing. */
  .shots-btn[aria-pressed="true"] {
    background: var(--sand); color: var(--ink); border-color: var(--sand);
  }
  .shots-btn i {
    display: block; width: 18px; height: 16px; background: currentColor;
    -webkit-mask: var(--shots) center / contain no-repeat;
    mask: var(--shots) center / contain no-repeat;
  }

  /* A ROOM OFF THE RAIL, NOT A PANEL ON IT - Babe, 2026-10-25: "it does
     start to feel unorganized... i may want like a totally different section
     for asset management", then "its like a full screen media panel that
     would basically appear over the journey so you can review it all after".
     THE BAND MIXED TWO JOBS IN ONE ROW. Browsing wants many things small and
     viewing wants one thing big, and a single strip of thumbnails was doing
     both badly - which is what "unorganized" was. They are side by side now:
     the grid chooses, the view shows.
     AND IT IS NOT A STEP IN THE JOURNEY, IT IS A VIEW OF IT. The rail stays
     five sections; this is somewhere you switch to rather than travel to,
     which is why it covers the page instead of joining it.
     A GRID IS CARDS, AND HERE THAT IS ALLOWED. "No cards" is a rule about
     the rail - the thing that must read as one continuous place - and this
     panel is explicitly not the rail. The same argument the collage made for
     itself: a different register earns itself where the section is doing a
     different job. The cells still share their dividers rather than floating
     apart, so it reads as one surface divided and not as tiles laid out. */
  /* A PANEL THE SIZE OF THE SCREEN DOES NOT GROW INTO PLACE - Babe,
     2026-10-25: "is there scaling on the media panel? kind of looks like a
     glitch when you press it on and off". Scaling from .965 is right for
     the result, which is content-sized and grows into the room around it;
     at 100vw the same scale drags every edge in from outside the viewport
     and back, which reads as the page lurching rather than as a panel
     arriving. It keeps the fade, which was the part doing the work. */
  .runover.is-shots,
  .runover.is-on.is-shots { transform: translate(-50%, -50%); }

  .runover.is-shots {
    width: 100vw; max-width: none;
    height: calc(100% - 8px); max-height: none;
    gap: 0; padding: 0;
    background: rgba(8,9,10,.94);
  }
  .runover.is-shots .runover-foot { display: none; }
  /* AND A FACE WITH NO FOOT KEEPS NO ROOM FOR ONE. */
  .runover.is-shots, .runover.is-key { padding-bottom: var(--pad); }

  /* THE KEY PANEL IS THE RESULT PANEL WITH A FORM IN IT, which is the same
     argument the review panel made: the overlay already dims and blurs every
     plane across the rail, sizes itself to its content, closes on an outside
     click and on Escape, and carries a foot that is a tray. A second modal
     would have re-solved all of that slightly differently.
     IT IS CONTENT-SIZED like a result rather than full-screen like the
     review panel, because it is one field and three sentences. */
  .runover.is-key { width: min(92vw, 540px); }
  .runover.is-key .runover-media { place-items: stretch; }
  /* NO FOOT ON THIS ONE - Babe, 2026-10-27: "we can prob remove that and just
     add save key on the right of the text box". The foot is a strip built to
     carry what a picture is and what you can do about it, and here there is no
     picture: its info cell had nothing to report but the state the bar's own
     glyph already shows, and its button belongs against the field it submits.
     The message line above it stays, which is where every state says itself
     now - asking Comfy, saved, or refused. */
  .runover.is-key .runover-foot { display: none; }
  .keyform { display: flex; flex-direction: column; gap: 14px; text-align: left; }
  /* THE MODAL SAYS WHAT IT IS - Babe: "make a header for the modal". It is the
     review panel's header, which is the same job one panel over, so it shares
     the rule rather than carrying a second copy of the same four numbers.
     THE INSET IS NOT SHARED, AND THAT IS WHY THIS WAS INDENTED - Babe: "align
     it to the left better". The review panel's header is full-bleed and pays
     for its own 12px; this one sits inside a panel that already has 20px of
     padding, so the same 12px pushed it a dozen pixels right of the paragraph
     and the field under it. The shared rule carries the type and the rule
     line, each panel carries its own edge. (It was written as an override and
     lost on source order, which is the quieter half of the same mistake.)
     AND IT IS BIGGER THAN THE REVIEW PANEL'S, which is the one thing it does
     not share: that header sits over a wall of thumbnails and is a label on a
     view you are already inside, while this one is the first line of a modal
     that opened on its own in front of somebody who has never seen this page.
     One number. */
  /* THE FIELD AND THE BUTTON ARE ONE ROW, flush, sharing the seam - the
     construction every tray and the result foot already use. The field takes
     the slack and the button is sized to its label, so a longer label never
     moves the field's left edge. */
  .keyrow { display: flex; align-items: stretch; }
  .keyrow input { flex: 1 1 auto; width: auto; min-width: 0; }
  .keyrow .run { flex: 0 0 auto; padding: 0 22px; font-size: var(--btn-f); letter-spacing: .14em; }
  .keyform p {
    margin: 0; font-family: var(--ui); font-size: 13px; line-height: 1.65;
    color: var(--sand-mid);
  }
  .keyform b { color: var(--sand); font-weight: 600; }
  /* THE ONE LINK ON THE PAGE. Somebody who needs this panel has never seen
     Comfy's dashboard, and "get a key" with nowhere to get one is the same
     dead end as "make a file called .env". */
  .keyform a { color: var(--sand); text-decoration: none; border-bottom: 1px solid var(--edge-lit); }
  .keyform a:hover { border-bottom-color: var(--sand); }
  .keyform input {
    width: 100%; height: var(--ctl-h); box-sizing: border-box;
    border: 1px solid var(--edge); background: var(--plate);
    padding: 0 12px; color: var(--sand);
    font-family: var(--mono); font-size: 13px; letter-spacing: .02em;
    transition: border-color .2s;
  }
  .keyform input:focus { outline: none; border-color: var(--sand-dim); }
  .keyform input::placeholder { color: var(--sand-dim); }
  /* AND A KEY ALREADY IN PLACE SAYS SO IN THE BOX - Babe, 2026-10-29: "should
     we make it look more like i have something there?", "like comfyui***",
     "a brighter text". The panel was identical whether or not there was a
     key, so an empty field read as an empty key and the honest answer was
     two floors away in the bar. It is a PLACEHOLDER and never a value: there
     is nothing to put in it, because the server never sends a key back - the
     box is genuinely empty and what it shows is that it does not need to be
     filled. Brighter than the ask, because this one is an answer. */
  .keyform input.is-set::placeholder { color: var(--sand-mid); }
  .runover.is-shots .runover-media {
    display: flex; flex-direction: column; place-items: stretch;
    width: 100%; height: 100%; min-height: 0;
  }

  /* the two halves, and the air around them is the bar's own inset */
  /* AND THE ROW HAS TO BE TOLD ITS HEIGHT, OR NOTHING INSIDE CAN SCROLL -
     Babe, 2026-10-26: "we are trying to sqweeze them all in the square
     panel, we need scrolling". This box had a definite height from the
     flex column above it and then handed its children an `auto` row, which
     sizes to content: the grid's own `overflow-y: auto` could never fire,
     because a box as tall as its contents has nothing to overflow. So the
     whole wall grew past the panel and the stage clipped it.
     `minmax(0, 1fr)` is the row saying take the height I was given, and the
     `0` is the half that matters - `1fr` alone still has an automatic
     minimum of its content. The same `min-height: 0` this file already
     carries on every flex child in the chain, said in grid. */
  .shots-body {
    display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 9fr);
    grid-template-rows: minmax(0, 1fr);
    gap: var(--shots-gut); flex: 1 1 auto; min-height: 0;
    padding: var(--shots-gut);
  }

  /* EACH COLUMN IS A BOX AND A ROW WELDED TO IT, which is the slot's own
     construction - Babe, 2026-10-25: "i kind of want to hide it or have it
     appear in a row at the bottom of the grid, so when you click on a
     thumbnail it displays there", and "would rather add a few buttons to the
     bottom right below the media". So the facts belong to the grid you
     picked from and the actions belong to the picture you are looking at. */
  .shots-left, .shots-view {
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    border: 1px solid var(--edge);
  }

  /* THE GRID CHOOSES. Three across, and it scrolls inside itself the way the
     tuner's knobs do - the document still does not scroll. */
  .shots-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    /* AND A ROW NEVER GIVES UP ITS HEIGHT TO FIT THE BOX - Babe,
       2026-10-26: "we are trying to sqweeze them all in the square panel,
       we need scrolling". Measured: the tile was 248x39 with a 248x140
       picture inside it, so the squashing was real and it was the GRID
       doing it. An auto row takes its item's min-content height as its
       floor, and `.shot` is `overflow: hidden`, which makes that floor
       ZERO - so a grid with a definite height and too many rows shrinks
       them all rather than overflowing, and a box that never overflows
       never scrolls. `max-content` puts the floor back at the picture. */
    grid-auto-rows: max-content;
    align-content: start; flex: 1 1 auto; min-height: 0; overflow-y: auto;
    overscroll-behavior: contain;
    /* NO LANE UNTIL THERE IS SOMETHING TO SCROLL - Babe, 2026-10-25: "maybe
       we need to remove that gap until the grid actually starts to fill up",
       "talking about the scrollbar gap". `scrollbar-gutter: stable` reserved
       it always, which buys a few pixels of stability nobody is looking for
       and costs a visible empty channel down the side of a wall of pictures
       for as long as the wall is short. The columns shifting slightly on the
       day the grid outgrows its box is the cheaper of the two. */
    /* AND IT HAS TO BE VISIBLE, WHICH A COLOUR THAT MATCHES THE WALL IS NOT
       - Babe, 2026-10-26: "i realized the media panel will need a
       scrollbar". It had one all along: `thin`, with the thumb at
       `--edge-lit`, which is the colour of a lit SEAM - right for a divider
       between two things and invisible as a line lying on near-black beside
       a wall of pictures. A scrollbar is the one piece of furniture here
       that has to be read at a glance, because it is the only thing saying
       there is more underneath.
       SO THE THUMB IS `--sand-dim`, the same brightness an empty slot rests
       at - quiet, and never mistaken for nothing. The track stays
       transparent: a channel drawn down the side of the grid is the lane
       this panel already decided not to reserve. */
    scrollbar-width: thin; scrollbar-color: var(--sand-dim) transparent;
  }
  /* AND IT IS THE SAME BAR AS EVERY OTHER ONE. Babe, 2026-10-28: "match the
     scrollbar", "with the agent scrollbar". This had its own width and no
     radius, which is one fact drawn twice - the shared rule below the form
     fields owns it now. */
  /* THE RATIO BELONGS TO THE PICTURE, NOT TO THE BUTTON. With aspect-ratio
     on the cell and height:100% on the media inside it, the row height and
     the item height each wanted the other first - and the grid resolved it
     at 127px for a 137px cell, so every tile overflowed into the one below.
     Ten overlapping pairs, which is what "getting overlapping grid items"
     was. Sizing the media and letting the button follow has no loop in it. */
  /* THE LINE IS AN OUTLINE DRAWN INTO THE GAP, and the grid keeps no colour
     of its own. Painting the container and letting the gaps show through is
     the usual trick and it floods the empty area under a short grid with
     the line colour - a grey panel below the last row. An outline takes no
     space, so each tile draws its own into the 1px it shares with its
     neighbour: the same single line, and nothing under the last row. The
     param row already paid for this lesson from the other side. */
  .shot {
    position: relative; overflow: hidden; padding: 0; cursor: pointer;
    background: var(--plate);
    border: 0; outline: 1px solid var(--edge);
    transition: opacity .15s;
  }
  /* WHICH SITTING MADE THESE - Babe, 2026-10-26: "we could make have a
     divider line based on sessions". The panel shows everything in output/
     ever, which was the right call while a session was a fiction and stopped
     being one the day sessions arrived. A full-width row between groups is
     the cheapest version of that: nothing is hidden, and the wall gets the
     one break it was missing.
     IT IS THE PANEL'S OWN ANNOTATION TYPE, not a heading - the same mono
     the file line under the grid uses, because it says the same kind of
     thing about what you are looking at. */
  .shots-div {
    grid-column: 1 / -1; background: var(--ink);
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--sand-dim);
    padding: 9px 11px 7px;
  }
  .shots-div:first-child { padding-top: 7px; }
  .shots-div b { color: var(--sand); font-weight: 400; }
  /* AND THE SITTING HAS THE SAME X ITS SHOTS DO - Babe, 2026-10-28, clearing
     the panel down for a shot of it: "maybe we can add an x on them to remove
     the entire session from view?". One verb, two scopes, and the same glyph
     in the same colours so there is nothing new to learn; it sits at the far
     end of the row rather than in a corner, because a divider is a line and
     not a box. The label is one child and the X the other, so the date does
     not become a flex item of its own. */
  .shots-div { display: flex; align-items: center; }
  .shots-div .x {
    margin-left: auto; width: 22px; height: 18px; padding: 0; line-height: 1;
    display: grid; place-items: center; opacity: 0;
    font-family: var(--mono); font-size: 15px;
    background: transparent; border: 0; color: var(--sand-dim);
    cursor: pointer; transition: opacity .15s, color .15s, background .15s;
  }
  .shots-div:hover .x, .shots-div .x:focus-visible { opacity: 1; }
  .shots-div .x:hover { color: var(--ink); background: var(--red); }
  /* AND THE LINES ARE THE GAPS NOW, NOT THE CELLS' OWN BORDERS. Those two
     rules counted to three - the first of every row, the whole first row -
     which is arithmetic that only holds while every child is a tile. The
     session dividers below are full-width children, so the counting would
     have gone wrong on the first one. A 1px gap over a grid the colour of a
     seam draws the same lines and cannot be counted wrong. */
  .shot:hover { opacity: .74; }
  /* THE CHOSEN ONE IS MARKED ON ITSELF, not on the edges it shares - the
     same lesson the param row's hover paid for four times. */
  .shot[aria-pressed="true"] { opacity: 1; }
  .shot[aria-pressed="true"]::before {
    /* OVER THE X, NOT UNDER IT - Babe: "can you make the red stroke over
       the x". The X is a control on the tile and the stroke is what the
       tile IS right now, so the stroke wins; it is 2px of inset outline, so
       it costs the X nothing but the corner it was already overlapping. */
    content: ''; position: absolute; inset: 0; z-index: 5; pointer-events: none;
    outline: 2px solid var(--red); outline-offset: -2px;
  }
  /* A TILE SHOWS THE WHOLE THING IT IS HOLDING, which is the rule every
     slot on the rail already follows and the one place that was breaking it
     - Babe, 2026-10-26: "the thumbnails are still squashed instead of
     16:9". `cover` crops to fill, so a 1:1 portrait in a 16:9 cell came
     back as a band across the middle of a face: the picture was not
     squashed, it was most of the way gone. A browsing wall where you cannot
     tell two takes apart is a wall of nothing.
     THE CELL KEEPS ITS SHAPE so the grid stays a grid - a wall of tiles at
     their own ratios is a mood board - and the picture bars out to the
     plate inside it, exactly as a slot does. */
  .shot img, .shot video {
    width: 100%; aspect-ratio: 16 / 9; height: auto;
    object-fit: contain; display: block; background: var(--plate);
  }
  /* THE SAME X, IN THE SAME CORNER, MEANING THE SAME THING - Babe,
     2026-10-25: "can we make x icons on the top right of each one to delete
     them from the session", "like we are making selects", "right. not delete
     from disk". Every slot on the rail already has one tucked hard into its
     top-right with no padding; a second shape for the same verb would be a
     second thing to learn. It shows on hover here rather than on a filled
     state, because every tile is filled by definition. */
  .shot .x {
    position: absolute; top: 0; right: 0; z-index: 4;
    width: 26px; height: 26px; padding: 0; line-height: 1;
    display: grid; place-items: center; opacity: 0;
    font-family: var(--mono); font-size: 17px;
    background: rgba(8,9,10,.72); border: 0; color: var(--sand-dim);
    cursor: pointer; transition: opacity .15s, color .15s, background .15s;
  }
  .shot:hover .x, .shot .x:focus-visible { opacity: 1; }
  .shot .x:hover { color: var(--ink); background: var(--red); }
  .shot.is-vid::after {
    content: ''; position: absolute; right: 6px; bottom: 6px; z-index: 3;
    width: 0; height: 0; border-left: 8px solid var(--sand);
    border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    filter: drop-shadow(0 0 2px rgba(0,0,0,.8));
  }

  /* THE VIEW SHOWS. One thing, as big as the half allows, on the plate - the
     result panel's own treatment, because this is the same job. */
  /* THE HEADER NAMES THE WORKFLOW, in the nav own type because they are the
     nav own words. Welded to the top of the picture the way a tray is welded
     to the bottom of a slot, and the same height, so the column reads as one
     object with a row at each end. */
  .shots-head, .key-head {
    flex: 0 0 auto; display: flex; align-items: center;
    min-height: var(--tray-h);
    border-bottom: 1px solid var(--edge);
    font-family: var(--label); font-size: 13px; font-weight: 500;
    letter-spacing: 0; text-transform: uppercase; color: var(--sand);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* THE KEY PANEL'S HEADER IS THE ONE HEADER SOMEBODY READS BEFORE THEY HAVE
     SEEN ANYTHING ELSE - Babe, 2026-10-28: "oh i want to make this header
     bigger too". The review panel's sits in a tray-height strip among other
     UI; this one opens on a blurred page with nothing else on it, and a
     tray's 13px read as a label rather than as the thing being asked.
     AND IT HAS TO SIT AFTER THE RULE IT OVERRIDES. There was a
     `.key-head { font-size: 17px }` 200 lines above this - same specificity,
     earlier in the file, so the shared 13px won and that header has been
     13px since the panel was built. The override looked like it worked
     because nobody measured it. */
  .key-head { font-size: 22px; letter-spacing: .01em; }
  /* full-bleed across the review panel, so it pays for its own edge */
  .shots-head { padding: 0 12px; }
  .shots-head:empty { display: none; }

  .shots-stage {
    flex: 1 1 auto; min-height: 0; display: grid; place-items: center;
    /* THE LETTERBOX IS BLACK, NOT PLATE - Babe, 2026-10-25: "can you make
       this letterbox black". A 16:9 clip in a taller box bars out top and
       bottom, and the plate grey made those bars part of the panel rather
       than part of the picture. True black is what a frame sits in, and it
       is also what the result panel already lets a picture bar out to. */
    background: #000; overflow: hidden;
  }
  .shots-stage img, .shots-stage video {
    max-width: 100%; max-height: 100%; width: auto; height: auto; display: block;
  }
  .shots-stage:empty::after {
    content: ''; display: block;
  }
  /* WHAT THE PATH ALREADY KNEW: the section, the day and time, the model and
     the seed are all in the filename, so the line under the picture is read
     rather than recorded. */
  /* THE TWO BOTTOM ROWS ARE ONE ROW, drawn twice - Babe, 2026-10-25: "make
     that bottom row the same size as the row on the left". They sit at the
     foot of two columns that end on the same line, so a few pixels between
     them reads as one of the columns being slightly wrong. --tray-h is the
     height every welded row in this page already uses, so both take it and
     neither is a number of its own. */
  .shots-line {
    display: flex; flex-wrap: wrap; align-items: center; gap: 3px 16px;
    flex: 0 0 auto; min-height: var(--tray-h);
    padding: 0 12px; border-top: 1px solid var(--edge);
    font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
    /* UPPERCASE, LIKE EVERY OTHER SMALL ROW IN THE PAGE - Babe,
       2026-10-25: "can we use all caps on the metadata". The param row,
       the trays, the tabs and the call-outs are all caps already; a line of
       lowercase mono at the foot of this column was the one row reading in
       a different voice. The values come off a filename, so they arrive
       lowercase and the stylesheet is the right place to fix that - nothing
       is sent anywhere in this case. */
    text-transform: uppercase;
    /* THE SAME TWO GREYS THE PARAM ROW USES - Babe, 2026-10-25: "is this
       the same text? maybe just keep it dim too, prob dont need the bright
       creme color", pointing at SEED in the model row. That row is
       --sand-dim for the label and --sand-mid for the value, a step rather
       than a jump; this line was running its values at full --sand, which
       made a row of file facts shout louder than the controls you act with. */
    color: var(--sand-mid);
  }
  .shots-line i { font-style: normal; color: var(--sand-dim); margin-right: 6px; }
  .shots-line:empty { display: none; }

  /* THE ACTIONS ARE A TRAY, and they sit hard right because they act on the
     thing above them rather than describing it. Same cells, same divider,
     same height as every other row of buttons in the page. */
  .shots-acts {
    display: flex; justify-content: flex-end; flex: 0 0 auto;
    min-height: var(--tray-h); border-top: 1px solid var(--edge);
  }
  .shots-acts .tr { flex: 0 0 auto; padding: 0 22px; }
  /* AND THE FIRST ONE KEEPS ITS LEFT LINE HERE - Babe, 2026-10-25: "edit
     button needs a line on the left". `.tr:first-child` drops it because in
     a tray the box it is welded to already draws that edge; this row floats
     right with nothing to its left, so the cell has to close itself. */
  .shots-acts .tr:first-child { border-left: 1px solid var(--edge); }
  .shots-acts:empty { display: none; }

  /* THE ARROWS ARE OFF THE BAR FOR NOW - Babe, 2026-10-27: "lets remove the
     arrow navigation for now". Hidden rather than deleted, the way the
     z-space tab is: `go()` writes `disabled` onto both on every travel, so
     taking the markup out would throw on the first move, and the nav words
     and the number keys travel anyway. One line to bring them back. */
  .arrows { display: none; }
  /* THE GALLERY AND THE KEY ARE ONE STRIP - Babe: "can we connect the media
     and key box". Cells flush, divided by the border they share, which is how
     a tray, the result foot and the param row are all built. */
  .bar-glyphs { display: flex; }
  /* EVERY CELL KEEPS ALL FOUR EDGES AND THE PAIR OVERLAPS BY THE SEAM - Babe,
     2026-10-27, on the first version: "missing the left side of the button".
     Dropping the second cell's left border leaves it relying on its
     neighbour's right one, and a cell whose box is only closed by the thing
     next to it reads as open. Pulling it a pixel left puts the two borders on
     the same pixel: one line between them, four sides each, and the pair is
     67px rather than 68. This is how the rail's trays are built. */
  .bar-glyphs > button + button { margin-left: -1px; }
  .ar-btn {
    font-family: var(--mono); font-size: 15px; line-height: 1;
    background: none; border: 1px solid var(--edge); color: var(--sand-dim);
    width: 34px; height: var(--ar-h); cursor: pointer; transition: color .2s, border-color .2s;
  }
  .ar-btn:hover:not(:disabled) { color: var(--sand); border-color: var(--sand-dim); }
  .ar-btn:disabled { opacity: .26; cursor: default; }
  .ar-btn:focus-visible { outline: 1px solid var(--red); outline-offset: 2px; }

  /* A SHARD IS A FRAME OF YOUR OWN CLIP, SITTING AT THE DEPTH OF THE PLANE IT
     IS IN. It takes the same treatment the room takes - darkened and inked
     down - because it is scenery, not a result: anything bright enough to
     read as a picture competes with the panel it sits behind. */
  /* THE SAME TREATMENT THE ROOM GETS, because it is the room: blurred,
     dimmed, desaturated and feathered on all four sides with the plate's own
     two crossed gradients. No border - an edge is what would make it read as
     a picture hung in the space rather than as part of it. */
  /* A LAYER'S OPACITY IS THE WHOLE ANSWER FOR HOW VISIBLE IT IS, and it was
     not - Babe, 2026-10-25: "all the layers there have opacity on 1.0 but
     they are still faded". `brightness(var(--void-dim))` was on every shard,
     and that knob belongs to the PLATE: "what comes out of a model is lit;
     the room is not" is a rule about one full-frame image behind the page,
     and it was quietly halving four layers that have a slider each.
     THIS IS THE SAME LESSON A FIFTH TIME. The armed layer forced .92 and no
     blur, then dimmed every other layer to .12, then kept a brightness lift
     after the opacity lift had gone - each one a second hand on the thing the
     slider was supposed to own, and each one read as the sliders being wired
     together. What you arrange is what you get, so nothing dims a shard now
     except the number next to it.
     SATURATION STAYS: the room is desaturated because it is a room, and that
     is a look rather than a dimmer. The baked opacities were divided by the
     .6 that used to be applied on top of them, so the composite is where
     Babe left it and the numbers are now honest about why. */
  .shard {
    position: absolute; display: block;
    filter: blur(var(--blr, 8px)) saturate(.6);
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 18%, #000 82%, transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 18%, #000 82%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0, #000 18%, #000 82%, transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 18%, #000 82%, transparent 100%);
    mask-composite: intersect;
    /* FOUR OF THESE STACK, so each one is faint: the sum is the room, and a
       single layer that reads on its own would be a picture again. */
    --shard-op: var(--op, .3);
    opacity: 0; animation: shard-in .9s cubic-bezier(.4,0,.2,1) forwards;
    pointer-events: none;
  }
  /* THE LAYER YOU ARE HOLDING COMES UP TO MEET YOU, because you cannot place
     what you cannot see: while it is armed it drops the blur and most of the
     dimming, and the rest of the room drops back so there is no doubt which
     one is moving. It is a handle, not a look - nothing here is baked. */
  /* AND ONLY ON THE SECTION YOU ARE STANDING IN. One layer belongs to every
     section that wears a collage, so arming it lit the copy on 04 and the
     copy on 05 at once - and a neighbour is drawn far wider than its own
     slide, so both were on screen. Babe, 2026-10-25: "why does 3 have two
     images attached to it". They all still MOVE together, because there is
     one table behind them; what you are shown is the one in front of you. */
  /* THE HANDLE FLOORS THE LOOK, IT DOES NOT REPLACE IT - Babe, 2026-10-25:
     "i think the opacity and blur is not affecting them because that is
     controlled by another value slider". It was this rule: arming a layer
     forced .92 and no blur, so the two sliders beside the cell did nothing
     visible for exactly as long as you were using them. Now the armed layer
     keeps its own blur and its own opacity, lifted to at least .55 and
     brightened - enough to place, honest about what it will look like when
     you put it down. */
  /* ARMED SHOWS THE TRUTH; ONLY A HAND ON IT LIFTS IT. The floor was on the
     armed state, so a layer you were holding could not be taken below .85 -
     Babe, 2026-10-25: "i just couldn't get 4 to have less opacity", with
     cell 4 armed in the screenshot. Arming is for choosing which layer the
     mouse owns, not for changing how it looks, so the lift belongs on the
     drag: grab it and it comes up enough to place, let go and it is exactly
     what it will be. */
  /* AND THE BRIGHTNESS WAS STILL ON THE ARMED STATE AFTER THE OPACITY CAME
     OFF IT - Babe, 2026-10-25: "im trying to figure out how to get them to
     be all the same opacity... like it seems like they are sharing the
     opacity of other layers". They were not sharing anything: all four sat
     at exactly the number on their slider, and the armed one was drawn at
     brightness(1) while the other three were at .6, so four equal layers
     could never look equal. Everything the handle does now lives on the
     drag. */
  /* AND IN THE END THE HANDLE DOES NOTHING TO THE LOOK AT ALL - Babe,
     2026-10-25: "currently when you select the layers they get brighter i
     dont want that to happen i just want them to stay the opacty they are".
     Arming picks which layer the mouse owns; the pressed cell is how you
     know which one that is. Nothing on the stage changes when you take hold
     of a layer, which means what you are arranging is what you will get.
     The cost is that a layer at .08 is dragged nearly blind - `is-dragging`
     is still put on <html> on mousedown, so a lift can come back on the drag
     alone if that ever turns out to matter. */
  /* AND NOTHING ELSE IS PUSHED DOWN TO MAKE ROOM FOR IT - Babe, 2026-10-25:
     "i barely see it. i press the button it lights up. then i press another
     button and the previous layer goes dim again". Dropping the others to .12
     was meant to say which one was armed and instead took the composition
     away: you cannot arrange four things against each other while three of
     them are hidden. The armed one comes up, the rest stay exactly as they
     will be, and .85 against .3 is already unmistakable. */
  /* THE NEIGHBOUR'S COLLAGE USED TO BE HIDDEN WHILE YOU ARRANGED, AND THAT
     RULE IS GONE - it was written when 04 and 05 both wore one and you could
     drag straight into the twin ("same with 2 if i move them over"). The
     collage is 05's alone now, so there is no twin to hide; what the rule
     still did was fire on the TRAVEL, because leaving 05 makes it
     `:not(.is-on)` - and `--shard-op` is read by a filled animation, which
     re-resolves instantly, so it could not fade. Babe, 2026-10-25: "when you
     go from 5 to 4 tho they just turn off... go dim. theres no gradual
     fade", "04 to 05 looks good tho". Measured: the plane itself was fading
     1 -> 0 over the full travel the whole time, and the shards on it were
     already at 0 on the first frame. They ride the plane's fade now, like
     everything else in the room. */
  @keyframes shard-in { to { opacity: var(--shard-op, .5); } }
  @media (prefers-reduced-motion: reduce) {
    .shard { animation: none; opacity: var(--shard-op, .5); }
  }

  @media (max-width: 1150px) {
    .back-col { width: 42%; }
    .headline { font-size: clamp(30px, 6.6vw, 74px); }
    .subhead { font-size: 13px; letter-spacing: .2em; }
    .mid-col { width: 48%; right: 4%; }
    .fore-col { width: 30%; }
    .call-c, .cost { width: 48%; right: 4%; }
  }
  @media (max-width: 820px) {
    .ck { padding: 6px 8px; font-size: 12px; letter-spacing: .12em; }
    .mark { font-size: 13px; }
    .back-col { width: 86%; justify-content: flex-start; padding-top: 5vh; }
    .mid-col { width: 86%; right: 7%; justify-content: flex-end; padding-bottom: 14vh; }
    .fore-col, .call-c, .numeral { display: none; }
    /* THE CALL-OUTS ARE GONE HERE, so there is nothing at 6vh to line up
       with, and the column is bottom-aligned rather than centred - a header
       pinned to the top of the stage would be stranded halfway up an empty
       screen, and a row pinned to the bottom would be underneath the panel
       it belongs to. Both go back into the flow. */
    .scene-k { position: static; margin-bottom: 11px; }
    .mid-col > .row { position: static; }
    .cost { width: 86%; right: 7%; bottom: 10vh; }
  }

</style>
</head>
<body class="intro">

  <div class="right-end">
    <!-- NO `title` ANYWHERE ON THIS PAGE - Babe, 2026-10-27: "this ui is
         really not that complex and i think we can remove hints". It is the
         argument the design already makes everywhere else: a slot says what
         it is in its own strip, a tray says what you can do with it, and a
         rung names its model on the row under RUN. A native tooltip is a
         second label the page cannot draw, cannot time and cannot style,
         arriving half a second late over the thing it is describing.
         THE ARIA LABEL IS NOT A HINT AND IT STAYS. `title` is a thing that
         appears on screen; `aria-label` is the name this button has for
         anyone not looking at it, and a bare glyph with no accessible name
         is a button a screen reader calls "button". -->
    <!-- THE ARROWS GO LEFT OF BOTH GLYPHS - Babe, 2026-10-27: "button in the
         top right or next to the gallery the arrows should prob go on the
         left side of both". So the bar reads travel, then the two things that
         open a panel over the rail: the gallery, and the key in the corner.
         THE TWO GLYPHS ARE A PAIR AND SIT AT ARROW DISTANCE from each other,
         with the group gap between them and the arrows - the same grammar the
         two arrows already use, where a pair is close and two jobs are
         apart. The key is in the bar at all because the bar sits outside
         `.stage` and never dims: it belongs to the app rather than to the

    <div class="arrows">

      <button class="shots-btn" id="shots" aria-label="Every shot you have made"><i></i></button>
      <button class="key-btn" id="keybtn" aria-label="Your Comfy API key"><i></i></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script>
(function () {
  var anime = window.anime;
  var root = document.documentElement;
  var stage = document.getElementById('stage');
  var cam = document.getElementById('cam');
  var navEl = document.getElementById('nav');

  function seedNow() { return String(Math.floor(Math.random() * 2147483647)); }

  /* IT IS DECLARED ABOVE THE TABLE BECAUSE THE TABLE IS A LITERAL. `SLIDES`
     is evaluated where it is written, and `var` hoists the declaration
     without the assignment - so a list defined further down the file arrives
     as `undefined` and the slot quietly renders no tabs. Nothing throws and
     nothing is logged; the strip is simply not there. Same trap as the
     duplicate `WIRED`, from the other direction. */
  /* 05's THREE JOBS, AND THEY ARE ONE WIDGET ON THE MODEL - Babe, 2026-10-25:
     "yeah the mode. maybe we should have a mode button", then "we could add a
     mode tho... as a tab system on the top like 04". Seedance 2.5's
     `task_type` is the whole of it:
       RECAST  reference - build a new shot around the clip's movement. The
                           clip is the motion, the pictures are the identity.
       EDIT    edit      - change one element and keep every source pixel
                           around it. Its own length and ratio win.
       EXTEND  extend    - carry the clip on past its last frame; what comes
                           back is only the new piece.
     EDIT WAS GOING TO BE A SIXTH SECTION and is a mode instead - "i dont
     really want to keep adding more sections". Five rungs stay five, and the
     rung that loops is the right one to grow a tab rather than a neighbour. */
  /* AND EACH ONE SAYS WHAT IT IS, WITH ITS NAME IN RED - Babe, 2026-10-26:
     "if the top right are modes, we need to change the same timing, my
     character line for each", "with the mode in red for each too". One line
     stood over four jobs and described exactly one of them: SAME TIMING, MY
     CHARACTER is RECAST, and it was sitting there while EDIT was pressed.

     THE LINE ON THIS RUNG IS SENT, WHICH THESE ARE WRITTEN FOR. 06 is one of
     the four rungs whose sub-header really reaches the model, so unlike 01's
     lead and 04's stems these are instructions rather than furniture - short,
     about movement, and never about a person, because ByteDance refuses a
     prompt that describes one.

     SO THE SENTENCE IS BARE AND THE NAME IS IN A TAG. `motionText` pushes
     text nodes and skips any element, which is the whole test: the sentence
     travels and the red word stays on the screen it was written for. That is
     also the accent's own rule - red marks the one thing on the line that is
     not literally what gets sent - and it is the opposite case from 04, where
     the mode chip resolves to nothing because the mode travels in the
     payload. Here the mode travels in the payload AND the line is the prompt,
     so the name has to be drawn and not said.

     (*) RECAST's IS BABE'S AND THE OTHER THREE ARE MINE. */
  var MOVEMODES = [
    /* RESHOOT, NOT RECAST - Babe, 2026-10-26: "should it be RESHOOT
       instead?". Yes, and for a sharper reason than it reading better:
       RECAST IS LITERALLY WHAT SWAP DOES. In a cutting room, recasting is
       putting a different actor in the same role - the footage stands and
       the person changes, which is `edit` and the tab next to this one. This
       mode throws the footage away and shoots the scene again: new frames,
       your character, your place, the same movement. That is a reshoot.
       So the two tabs stop competing for one word and each takes the one
       that describes it.
       THE ID STAYS `RECAST`, because a display name is not an address - the
       same call SEQUENCE made when it became BOARD. Nothing on the server
       keys on it either way: this mode IS the base spec, which is why there
       is no `modes.RECAST` entry beside SWAP, EDIT and EXTEND. */
    /* AND ALL FOUR NEED WORDS - Babe, 2026-10-26: "can we make the RUN
       button empty untl you are ready to prompt". A clip in the box released
       RUN by itself, because the gate every writing slot carries is
       `:not(.is-full)` - a picture alone IS a job on 01, where the floor
       sentence has something to point at. **This rung has no floor.** Every
       one of these four is an instruction - reshoot it, swap who is in it,
       change one thing, carry it past the end - and a clip with no sentence
       beside it says only *here is a clip*. `needs` is the mode saying it
       cannot run on a picture alone, which is 01's EDIT exactly, and it is
       on the table rather than on the slot because that is where the other
       three mode flags live. */
    /* AND EACH ONE ASKS ITS OWN QUESTION - Babe, 2026-10-26: "could also help
       if the messsaging was different per tab so it looks like you are
       changing modes". The line under the panel already changed with the tab
       and the box did not, so the one thing you are looking at while you type
       was the same sentence on all four. "openAsk" has read the pressed tab's
       "ask" before the slot's own since 01 grew two modes; these four are the
       first to use it on this rung.
       (*) ALL FOUR ARE MINE AND BABE'S TO CUT. Each names what that mode
       leaves open: a reshoot is the whole shot, a swap is who is in it, an
       edit is one thing, an extend is what comes next. */
    /* (*) WHAT EACH MODE DOES TO YOUR FOOTAGE, AND NOT HOW TO PROMPT IT -
       Babe, 2026-10-27: "i think when you click on a mode if a ? was next to
       agent that could maybe break down what the mode does would be nice".
       The distinction is what stops this duplicating the agent: the agent
       writes the sentence, this says which machine the sentence is going
       into. It is also the thing that actually bit us - a mouse held to a
       mouth survived EDIT and became a regulator under RESHOOT, and nothing
       on screen said why. Four lines of mode semantics, not a prompting
       tutorial: anyone who reads them writes a better sentence without being

    { k: 'RECAST', n: 'Reshoot', needs: true,

  /* THE TEMPLATE IS THE ARTWORK AND THE THUMBNAIL AND THE REFERENCE.
     One drawing used at three sizes: a thumbnail in the picker, a full-size
     raster handed to the model as its layout reference, and an .svg on disk
     to look at while designing it. What you click really is what the model
     is given - there is no second illustration to drift out of step.

     EVERY MARK IS A PANEL OR A WORD. The first version drew dashed heads and
     bodies as scale guides; they told the model to copy the guide's build
     instead of the hero's, and two different views came out as the same
     drawing. A rectangle and a label say the whole thing without lying about
     anatomy.

     THE TEMPLATE IS GREY ON BLACK, THE SHEET IT ASKS FOR IS BLACK. The panels
     have to be visible against their own gutters to read as divisions, so the
     page is near-black and the panels are a shade up. The prompt asks for a
     pure black ground in the result regardless - worth watching on the first
     run that the grey does not come back in the output. */
  /* WHITE ON BLACK, BECAUSE A GUIDE HAS TO BE READABLE AS A GUIDE. The panels
     were #1c1c1c on #000000 - a difference of eleven percent that a person can
     see on a good monitor and a model can easily miss, and the first Hero
     sheet came back with five panels instead of four. Babe, 2026-10-24:
     "maybe our reference images should be white instead of grey since that is
     so close to black". Nothing else about the drawing changed, and the
     scaffolding now says in words that these are not colours to copy.
     THE PICKER DIMS IT RATHER THAN REDRAWING IT (see .sheetbox .tmpl), so
     what you click on is still the same drawing the model is handed. */
  var SHEET_BG = '#000000', SHEET_PANEL = '#ffffff', SHEET_INK = '#000000';

  /* a sheet's own ratio at roughly `mp` megapixels, on a multiple of 8 -
     the same arithmetic app.js uses to ask the model for a size */
  function sheetSize(sheet, mp) {
    var a = (sheet.ar || '16:9').split(':');
    var r = (+a[0] || 16) / (+a[1] || 9), px = (mp || 2) * 1e6;
    return { W: Math.round(Math.sqrt(px * r) / 8) * 8, H: Math.round(Math.sqrt(px / r) / 8) * 8 };
  }

  /* `bare` leaves the labels off. They are instructions to the model and
     they are unreadable at slot size, so in the picker they are ink that
     says nothing - the arrangement is the whole message there. The page the
     model is handed is never bare. */
  function sheetTemplate(sheet, W, H, bare) {
    if (!W || !H) { var d = sheetSize(sheet, 2); W = d.W; H = d.H; }
    var gut = W * 0.006;                    /* the black between panels */
    var fs = W / 50, lh = fs * 1.18;
    var g = '<rect width="' + W + '" height="' + H + '" fill="' + SHEET_BG + '"/>';

    for (var i = 0; i < sheet.panels.length; i++) {
      var p = sheet.panels[i];
      var x = p.x * W + gut / 2, y = p.y * H + gut / 2;
      var w = p.w * W - gut, h = p.h * H - gut;
      g += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) +
           '" height="' + h.toFixed(1) + '" fill="' + SHEET_PANEL + '"/>';

      if (bare) continue;

      /* the label sits in the middle of its own panel, so a panel that is
         half the height still reads as one thing with one name */
      var cx = x + w / 2, cy = y + h / 2;
      var top = cy - ((p.label.length - 1) * lh) / 2 + fs * 0.34;
      g += '<text x="' + cx.toFixed(1) + '" y="' + top.toFixed(1) +
           '" fill="' + SHEET_INK + '" text-anchor="middle" font-weight="700"' +
           ' font-family="Arial, Helvetica, sans-serif" font-size="' + fs.toFixed(1) + '">';
      for (var k = 0; k < p.label.length; k++) {
        g += '<tspan x="' + cx.toFixed(1) + '"' + (k ? ' dy="' + lh.toFixed(1) + '"' : '') + '>' +
             p.label[k].replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</tspan>';
      }
      g += '</text>';
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H +
           '" width="' + W + '" height="' + H + '">' + g + '</svg>';
  }

  /* the slot shows the same drawing, scaled and without its labels - the
     arrangement is what is being picked there, and type nobody can read is
     only ink. The page the model is handed is this drawing at full size,
     labels and all. */
  function sheetPreview(sheet) {
    var d = sheetSize(sheet, 2), k = 720 / d.W;
    return sheetTemplate(sheet, Math.round(d.W * k), Math.round(d.H * k), true)
      .replace('<svg ', '<svg class="tmpl" aria-hidden="true" ');
  }
