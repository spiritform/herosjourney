     be a conversation about nothing in particular, under a header reading
     EDIT AGENT.
     IT WAS HIDDEN TO PAY FOR ITS OWN HEIGHT, and that debt is settled one
     level up: the strip is every slot's top row now, so no slot can be a
     strip taller than its neighbour and nothing has to be hidden to keep two
     columns level. */
  /* AND THERE IS NO INNER STRIP LEFT TO HIDE. Two rules lived here -
     `.slot.is-agent .writer .ftabs` and `.slot.has-board .writer .ftabs` -
     for the one slot whose tabs sat inside its box. 04's tabs are the slot's
     top row now, like every other tabbed slot's, and that row never changes
     height for anyone: the mode does not go away because you asked the agent
     for help, and a drawn board does not take the name off a slot.
     A MECHANISM THAT EXISTED TO STOP TWO THINGS DISAGREEING OUTLIVED ONE OF
     THEM, which is the shape this file has written down once already. */
  /* AN ENUMERATION, AND IT IS PRICED. CSS cannot ask whether a form exists
     for the mode a slot is wearing, so each pair is written out - two for 04
     and one for 05. Everything else about a form slot asks a class now. */
  .slot:not(.is-agent)[data-mode="single"] .form[data-form="single"],
  .slot:not(.is-agent)[data-mode="sequence"] .form[data-form="sequence"],
  .slot:not(.is-agent)[data-mode="motion"] .form[data-form="motion"] {
    display: flex;
  }
  /* the direction box is the form's output and is only ever shown when the
     artist asked to write it themselves - which is any mode with no form
     behind it, CUSTOM on 04 and CUSTOM on 05 under its own key. */
  .slot.has-form:not(.no-form) .say { display: none; }
  /* A DARK PANEL WITH DROPDOWNS ON IT - Babe, 2026-10-25: "lets make
     the dark panel and then some dropup panels or something" - then
     "dropdown". Cycling was
     fine with six words and wrong with eight: you cannot see what you are
     choosing between, only what you are on, so finding EXTREME CLOSE-UP means
     pressing past five things you did not want. A list that opens shows the
     whole choice at once and costs the same one press. It opens upward
     downward, over the tray and past the end of the slide, which is what a
     list hanging off a control does everywhere else. */
  .controls {
    display: none; flex: 0 0 auto; align-items: stretch; height: var(--tray-h);
    border-top: 1px solid var(--edge); background: var(--void);
  }
  .dial { position: relative; display: flex; }
  .dropdown {
    display: none; position: absolute; left: -1px; top: 100%;
    min-width: calc(100% + 2px); z-index: 20;
    background: var(--plate); border: 1px solid var(--edge);
    padding: 4px 0;
  }
  .dial.is-open .dropdown { display: block; }
  .dial.is-open > .tr { color: var(--sand); }
  .dropdown button {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; padding: 0 13px; height: 30px;
    font-family: var(--mono); font-size: 13px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--sand-mid); cursor: pointer;
    white-space: nowrap; transition: color .12s, background .12s;
  }
  .dropdown button:hover { background: var(--sand); color: var(--ink); }
  .dropdown button[aria-pressed="true"] { color: var(--sand); }
  .slot.is-agent .writer { display: none; }
  .slot.has-board:not(.is-agent) .writer { display: none; }
  .slot.has-board:not(.is-agent) .boardbox { display: flex; }
  /* AND THE WAY BACK TO THE FORM IS THE HEADER - Babe, 2026-10-25: "how do you
     suggest we go back to the prompt to edit?". Their own suggestion was to
     make AGENT the way back, but AGENT is a face of this panel, not the form,
     and the panel would lose it. The cell that names the other side is already
     the rule here - REPLACE | SHEET on the frame beside it, the X on 01's
     prompt box - and this header is already the way out of the agent, so it
     carries the same job one state further. The board is kept while you edit,
     so RUN redraws rather than starting from nothing. */
  .slot.has-board.is-editing:not(.is-agent) .writer { display: flex; }
  .slot.has-board.is-editing:not(.is-agent) .boardbox { display: none; }
  /* THE TWO FACES OF A SLOT THAT HAS DRAWN SOMETHING. Hidden until there is
     a second face to go to, and then the header has nothing left to name -
     the pressed cell says where you are - so it stays only as the cell that
     gives up its width to the rest of the row. */
  .pick-face { display: none; }
  /* AND BOTH OF THEM WAIT FOR IT - Babe, 2026-10-29, on arriving at 04: "it
     seems like agent should be there and that prompt is already selected",
     "kind of confusing". PROMPT was drawn on a slot with ONE face, pressed,
     and the only thing pressing it did was reveal the agent - a door standing
     in front of the room you are already in. The comment above has said since
     it was written that the pair is hidden until there is a second face to go
     to; the prompt half was asking `has-form` and the board half `has-board`,
     so only one of them obeyed it. */
  .slot.has-form.has-board:not(.is-inface):not(.is-agent) .pick-face[data-face="prompt"],
  .slot.has-board:not(.is-inface):not(.is-agent) .pick-face[data-face="board"] {
    display: block;
  }
  /* AND THE HEADER IS ONE LEVEL IN TOO. At the top the three cells say what
     the slot can be and the pressed one says which it is; a header there
     would be naming the row a second time, and it was taking the whole width
     to do it. */
  /* AND IT IS THE BOARD THAT TAKES THE HEADER AWAY, not the form. On 04 the
     three cells say what the slot can be and the pressed one says which it
     is, so a header there names the row twice; 05 has one face, so its row
     is a header and the agent, which is what every writing slot wears. */
  /* AND `:has(.boardbox)` WAS THE WRONG TEST FOR THAT: the box is in the
     markup from the first frame, drawn or not, so this hid the header on a
     slot with nothing to tell apart from. It asks for a DRAWN board now, and
     a form slot with one face wears a header and an agent exactly as 05
     does. */
  .slot.has-form.has-board:not(.is-inface) .tray-k { display: none; }
  /* IMPORT IS A TOP-LEVEL ANSWER, like it is on every other slot: a board you
     bring instead of one you draw. Inside the writing face it would throw the
     sentence away, which is the same reason 01 does not offer it there. */
  /* AND THE AGENT'S FACE IS A FACE TOO, which only became visible once the
     row was drawn at rest: the conversation is a place you are standing in,
     and a cell that replaces the thing you are talking about does not belong
     in it any more than it does in the writing face. */
  .slot.has-form.is-inface .tr[data-act="import"],
  .slot.has-form.is-agent .tr[data-act="import"] { display: none; }
  /* THE SAME CHEVRON THE AGENT FACE USES - Babe, 2026-10-25: "direction should
     have the < too", "thats what we use on 03". It is drawn by CSS rather than
     written into the text so there is one source of the mark, and it sits on
     both states: with a board showing it offers the form, and while you are in
     the form it offers the board back. */
  /* THE WAY BACK, ON ALL THREE FACES THAT HAVE ONE. NO MARGIN: .tray-k is a
     flex container, so ::before is a flex ITEM and the row gap already sits
     between the chevron and the label. The 11px margin was being added to
     that 6px rather than replacing it - 17px of air beside a 12px label,
     while every other pair in the same header sat on 6. One value governs
     the row now, which is also why this only showed up once the type came
     down: at 13.5px the extra was proportionally smaller.
     It is in em so the
     chevron keeps its relationship to the label rather than growing
     against it: it was 16px beside 13.5px, and the header is 12px now. */
  /* THE PANEL BECOMES THE BOX THE RESULT ARRIVES IN - Babe, 2026-10-25: "when
     you hit run we may want to switch to this video with the loading
     animation", and "instead of the red line / the red line is for the main
     motion workflow". Two generations on one rung need two ways of saying
     working, and the thin rule under the prompt is spoken for. The form has
     already done its job by the time this runs, so handing the square over to
     the destination hides nothing you still need - and a line scanning an
     empty box says where the picture is going to land, which a bar on a seam
     does not. */
  /* AND THIS ONE IS THE BOARD'S TOO: the writer gives way to the box the
     picture is going to land in, and 05 has no such box - its result opens in
     the panel like every other rung's, so the form stays where it is. */
  .slot.has-form:has(.boardbox).is-working .writer { display: none; }
  /* AND THAT HAS TO BEAT THE EDITING RULE, WHICH IS LONGER - Babe,
     2026-10-27, pressing RUN after stepping back to change the framing on a
     board already drawn: the form and the waiting box both stood in the
     column and the slot grew past the top of the screen, which is the shape
     of "agent broke the ui" on another face.
     `.slot.has-board.is-editing:not(.is-agent) .writer` counts four classes
     to this rule's three, so it won and kept the writer in place while the
     box it swaps with was told to appear. A run is not an edit: while one is
     in flight there is nothing to go back to, so the working state outranks
     the editing one and says so at the same length. */
  .slot.has-board.is-editing.is-working:not(.is-agent) .writer { display: none; }
  /* AND NOT OVER THE AGENT PANEL. Both are square boxes in the same column,
     so a run started from the agent face drew both and stood the slot 400px
     taller than the one beside it - Babe, 2026-10-26: "agent broke the ui".
     `runBoard` steps out of the agent face on the way in, and this says the
     same thing in the stylesheet, which is the half that cannot be skipped. */
  .slot.has-form.is-working:not(.is-agent) .boardbox { display: flex; }
  /* AND WHILE IT IS WORKING THE BOX IS GLASS AGAIN - Babe, 2026-10-27: "i
     also noticed this is black background it should be glass so maybe the ui
     is oudated". It was not outdated, it was honest and stale: a box goes
     black the moment it HOLDS a picture, and after one board it holds the
     last one for the whole of the next run. A box with a waiting mark in it
     is not holding anything yet, so it goes back to the window it was.
     THE PICTURE IS HIDDEN, NOT THROWN AWAY. A failed run should leave you
     the board you had rather than an empty square, and both of these rules
     stop matching the moment `is-working` comes off. */
  .slot.is-working .boardbox { background: var(--plate-glass); }
  .slot.is-working .boardbox > img,
  .slot.is-working .boardbox > video { display: none; }
  /* the box is the progress now, so the seam stops saying it too. The waiting
     mark is `.wait`, the three growing squares rung 01 already uses while it
     rolls a reference - Babe, 2026-10-25: "we have a growing square animation
     we made for 01 we can use". One way of saying working, in both places it
     happens. */
  .slot.has-form.is-working .slot-prog { opacity: 0; }
  /* ONE CELL, NAMING THE OTHER SIDE - Babe, 2026-10-25: "you press agent to
     get this new panel in the same panel... and the bottom changes". So each
     level shows the way deeper and the way to act, and nothing else: the row
     is AGENT and RUN while you are writing, PROMPT and RUN while you are
     talking. It is SHEET and FRAME on the hero slot, one level in. */
  /* HEADER LEFT, BUTTONS RIGHT - Babe, 2026-10-25: "that is the same
     pattern we are using everywhere". The header names the face you are on,
     the cells name the way across and the way to act, and the row reads the
     same as every other row on the rail. */
  .tr.face { display: none; }
  .slot.has-form.is-inface:not(.is-boxing) .tr.face,
  /* AND ON A FORM SLOT WITH NOTHING DRAWN, ALWAYS - the form IS the writing
     face there, so there is no door to press and the agent is simply in the
     row. The moment a board exists the slot has two faces again and this
     stops matching, which is the same sentence the pick cells are gated on. */
  .slot.has-form:not(.has-board):not(.is-boxing) .tr.face,
  /* AND ON A SLOT THAT IS ONLY A BOX, ALWAYS. The two rules either side are
     scoped to being inside a face because on those slots the writing is one;
     here it is the slot, and there is no picture tray for the cell to be a
     fourth thing in. */
  .slot.is-writing:not(.is-boxing) .tr.face,
  /* and on a writing slot only while the box is open: in the picture tray it
     would be a fourth cell offering to write something nobody is writing. */
  .slot.is-asking.writes:not(.is-boxing) .tr.face { display: block; flex: 0 0 auto; padding: 0 22px; }
  /* AND THE BOX CELL TAKES THAT RULE TOO, for the reason written above it:
     in a picture tray it would be a fourth cell offering to draw on
     something nobody is writing about. The one difference is that it must
     not show while the box face is UP - the row inside a face is the way
     back and the thing that acts, and a cell offering the face you are
     standing in is the never-both rule the camera row already keeps. */
  .tr.boxes { display: none; }
  .slot.has-form.is-inface:not(.is-boxing) .tr.boxes,
  .slot.is-writing:not(.is-boxing) .tr.boxes,
  .slot.is-asking.writes:not(.is-boxing) .tr.boxes { display: block; flex: 0 0 auto; padding: 0 14px; }
  /* AND THE AGENT CELL AND THE ? STAND DOWN WHILE IT IS UP - which has to be
     said on the SHOW rules and not as a hide rule of its own.
     `.slot.is-asking.writes .tr.face` is three classes to
     `.slot.is-boxing .tr.face`'s two, so the hide lost the race and the row
     drew AGENT and ? beside a face they cannot reach. Babe's screenshot,
     2026-10-29. Draw a state on the rule that owns it; a second rule
     arguing with the first is the seam this picker already paid for. */

  /* THE ? IS THE AGENT CELL'S RULE EXACTLY, because it is that cell's
     neighbour and the two are only ever wanted in the same breath. Narrower,
     because a single glyph does not want a word's padding. */
  /* AND THE ? STAYS UP INSIDE THE BOX FACE - Babe, 2026-10-29: "the ? needs
     to talk about the boxes feature". It is the one cell in that row with
     something to say there: AGENT helps you write a sentence and the box
     face is not where you write one, but what a box DOES is exactly the
     question somebody standing in front of an empty square has. */
  .tr.why { display: none; }
  .slot.has-form.is-inface .tr.why,
  .slot.has-form:not(.has-board) .tr.why,
  .slot.is-writing .tr.why,
  .slot.is-asking.writes .tr.why,
  .slot.is-boxing .tr.why { display: block; flex: 0 0 auto; padding: 0 14px; }
  /* THE NOTE STANDS ON THE WRITING FACE'S OWN PLATE - Babe, 2026-10-27: "can
     we add the help into the actual panel as like a toggle. so its per mode in
     the prompt sections of that mode". It was the result overlay with all four
     modes in it, which dimmed the whole rail to answer a question about the
     sentence under your cursor. It is one mode now, in the box, and the tabs
     are a foot away if you want to read another.
     IT COVERS THE BOX RATHER THAN PUSHING IT, so nothing in the panel moves
     while it is up and the sentence is exactly where you left it. */
  .whybox {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; gap: 8px; justify-content: center;
    padding: 18px; box-sizing: border-box; text-align: left;
    background: rgba(8,9,10,.82);
  }
  .whybox b {
    font-family: var(--cond); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--red);
  }
  .whybox span { font-size: 14px; line-height: 1.6; color: var(--sand); }
  /* THE STRUCTURE IS A FOOTNOTE AND A LIST, not a second paragraph: it is the
     one piece of the scaffolding worth showing, and it is three things rather
     than a sentence. Its own column, so the lines sit tight together instead
     of taking the note's paragraph gap between them. Mono, so the names line
     up as the labels they are. */
  .whyhow { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
  /* AND IT IS SET LIKE A LABEL - Babe, 2026-10-27: "also all caps", "brighter
     text". It was the quietest thing in the note at the dim step, which is
     the colour an empty slot rests at; these are the three names the model
     reads the references by, which is a fact worth being able to read. Caps
     want their own tracking or the mono runs together. */
  .whybox i {
    font-style: normal; text-transform: uppercase;
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
    letter-spacing: .08em; color: var(--sand-mid);
  }
  /* THE PRESSED STATE IS ALREADY DRAWN, and writing a second one is how the
     glyph disappeared - Babe, 2026-10-27: "also the ? is lost". `.tr[aria-
     pressed="true"]` fills the cell with sand and sets the text to ink; this
     had put `color: var(--sand)` on top of that, which is sand on sand. The
     rail draws a pressed cell one way and this is a cell. */
  /* AND IT IS DRAWN IN THE AGENT'S FACE TOO, which took deleting the rule
     that said otherwise. `.slot.is-agent .tr.why` is four classes and the
     rule above it is five, so the cell has been pressable there since the
     day it was written while this said it was not - and the note it opened
     went into `.drop`, which that face hides. It hangs on `.helper` now; see
     `whyBits`. A press that reaches a cell has to be answered. */
  /* the panel is the other side of the box you were writing in */
  .slot.is-agent .drop { display: none; }
  /* THE ANGLE IS SINGLE's ONE CONTROL - Babe, 2026-10-25: "so SINGLE [camera
     angle][run]", pointing at the LENS cell on 03. A single shot is one
     framing of a scene that is already decided, so the framing is the whole
     choice, and it cycles in place the way the param cells on the bottom row
     do rather than opening a menu over the panel.
     THE SIX IT CYCLES ARE THE SEQUENCE BOARD'S SIX, read straight off MODES:
     a single shot is one panel of that board, so there is one list and not a
     second one that could drift from it. */
  /* FIXED WIDTH, BOTH HALVES. The cell cycles through words of very
     different lengths - AUTO to OVER THE SHOULDER - so a cell that fits its
     contents would drag RUN left and right every time you press it, and the
     word FRAMING would slide under your own cursor. The cell holds its width
     and the value holds its own column inside it, so the only thing that
     moves when you press is the word. */
  /* EACH CONTROL HOLDS ITS OWN WIDTH, label and value both, so pressing one
     never moves the one beside it. */
  /* no dividers between them: the row below is cells, this row is settings,
     and borrowing its seams was half of why the two looked alike. */
  .controls .tr {
    flex: 0 0 auto; padding: 0 0 0 13px; text-align: left; border-left: 0;
  }
  .controls .tr b {
    display: inline-block; font-weight: 400; color: var(--sand); margin-left: 9px;
  }
  .controls .tr.framing { width: 232px; }
  .controls .tr.framing b { min-width: 150px; }
  .controls .tr.lens { width: 128px; }
  .controls .tr.lens b { min-width: 60px; }
  /* the mode cells belong to the drawing, so they leave with it */
  /* IT KEEPS ITS OWN RATIO INSIDE A SQUARE BOX - the bible stands up, the
     hero lies down - which is half of what the preview has to tell you. The
     drawing carries width and height so the box can scale it like a picture
     rather than stretching it to the frame. */
  .sheetbox .tmpl {
    max-width: 100%; max-height: 100%; width: auto; height: auto; display: block;
    /* the same drawing the model gets, turned down to sit in a dark panel.
       Dimming is not redrawing: there is still one template. */
    filter: brightness(.17);
  }

  /* A ROW IS A ROW, NOT TWO CELLS IN ONE BIG GRID - Babe, 2026-10-25: "the
     form is kind of broken too... maybe it fills the entire height of that
     panel. two line one is not working". A value that wrapped to two lines
     drew its second line THROUGH the field below it: the text grew and the
     track it sits in did not.
     THE CARD WAS ONE GRID OF EIGHTEEN LOOSE CHILDREN, so every label and
     every field was a track in the same table and a field's height was a
     negotiation with eight rows it has nothing to do with. Each trait is its
     own little grid now - a label, a field, and its own height - which is
     the same move `.inp` makes for a slot and `.fs` makes for a form field.
     A row cannot be too short for what is in it when it IS what is in it.
     AND THEY SHARE THE HEIGHT OF THE PANEL - "maybe it fills the entire
     height of that panel". `flex: 1 0 auto` is content-height as the floor
     and an equal share of what is left over on top, so five fields fill a
     square box instead of stacking at the top of one. `0` for shrink is the
     load-bearing part: a row must never be compressed under its own text,
     which is the bug this is fixing arriving by another route. The card
     scrolls instead, as it always did. */
  .card {
    display: none; aspect-ratio: 1 / 1; max-height: var(--slot-cap);
    border: 1px solid var(--edge); background: var(--plate-glass);
    overflow: auto; padding: 14px;
    flex-direction: column; gap: 7px;
    position: relative;
  }
  .slot.is-describing .card { display: flex; }
  /* ONE COLUMN OF LABELS, AND STILL A ROW PER TRAIT - Babe, 2026-10-25: "this
     is the right idea i just want them aligned better... like you had it
     before". Rows of their own fixed the height; they also let every row size
     its own label column, so NAME and MOVEMENT started their fields in
     different places.
     `subgrid` IS THE ONE TOOL THAT IS BOTH. The columns are the card's, so
     every field begins on the same line; the rows are each trait's, so a
     wrapped value grows its own row and nothing else. Neither half is a
     literal: no width is written down, so a trait with a longer name still
     lines up.
     THE BOXES SHARE THE HEIGHT AND THE AIR IS THE GAP - Babe, 2026-10-26:
     "can you keep the taller text boxes you had i was just thinking adding
     more padding between them. to push the last one down more because there
     was a gap at the very bottom".
     FOUR WAYS TO SPEND THE LEFTOVER AND THIS IS THE FOURTH. An equal share
     each (this, but tight); all of it to the last row, which made one field
     enormous; all of it into the gaps, which left every box the size of its
     own sentence; and this - an equal share each AGAIN, with a bigger gap, so
     the boxes are generous and still have air between them. `1fr` rows keep
     an automatic minimum, so a value that wraps still cannot be squashed.
     NO ROW TEMPLATE, so the count is not written down: add a trait and it is
     another row in the division.
     THE MESSAGE LINE IS OUTSIDE THE GRID and now takes no room until it has
     something to say, which is what the gap at the very bottom was: 13px of
     reserved height plus its margin, under a card that otherwise ends on its
     own padding. */
  .traits {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: auto 1fr;
    gap: 14px 10px;
  }
  .trait { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; }
  .slot.is-describing .drop { display: none; }
  .traits-k {
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--sand-dim); padding-top: 5px; white-space: nowrap;
  }
  /* contenteditable rather than an input, to match .say and .ask - the page
     has one way of typing into a thing and this is it. */
  .tf {
    font-family: var(--ui); font-size: 14px; line-height: 1.45; color: var(--sand);
    border: 1px solid var(--edge); background: rgba(8,9,10,.5);
    padding: 4px 8px; outline: none; min-height: 20px;
    transition: border-color .15s;
  }
  .tf:focus { border-color: var(--sand-dim); }
  .tf:empty::before { content: attr(data-ph); color: var(--sand-dim); }

  /* A SCROLLBAR IN A WRITING BOX IS FURNITURE, NOT CONTENT - Babe,
     2026-10-28, with the agent's three-shot timeline filling the box:
     "lets update the scroll bar and dim it a bit... it seems so bright".
     The browser default is a light grey bar on near-black, which on this
     panel is the brightest thing on screen and is a thing you are not
     meant to be looking at. It takes the treatment the model menu, the
     review grid and the collage panel already wear: thin, no track, a
     thumb the colour of a lit seam, going to sand only on hover - the same
     rule as every other cell here, which is that a state is drawn when you
     point at it. */
  .say, .tf, .ask, .compose-in, .helper-log, .form, .writer, .shots-grid {
    scrollbar-width: thin; scrollbar-color: var(--sand-dim) transparent;
  }
  .say::-webkit-scrollbar, .tf::-webkit-scrollbar, .ask::-webkit-scrollbar,
  .compose-in::-webkit-scrollbar, .form::-webkit-scrollbar,
  .writer::-webkit-scrollbar, .shots-grid::-webkit-scrollbar { width: 12px; }
  .say::-webkit-scrollbar-track, .tf::-webkit-scrollbar-track,
  .ask::-webkit-scrollbar-track, .compose-in::-webkit-scrollbar-track,
  .form::-webkit-scrollbar-track, .writer::-webkit-scrollbar-track,
  .shots-grid::-webkit-scrollbar-track {
    background: transparent;
  }
  .say::-webkit-scrollbar-thumb, .tf::-webkit-scrollbar-thumb,
  .ask::-webkit-scrollbar-thumb, .compose-in::-webkit-scrollbar-thumb,
  .form::-webkit-scrollbar-thumb, .writer::-webkit-scrollbar-thumb,
  .shots-grid::-webkit-scrollbar-thumb {
    background: var(--sand-dim); border: 3px solid transparent;
    background-clip: content-box; border-radius: 8px;
  }
  /* AND NO ARROW BUTTONS. The default draws one at each end, which on a
     dark panel is two bright chips with nothing else like them on screen. */
  ::-webkit-scrollbar-button { display: none; }
  .say::-webkit-scrollbar-thumb:hover, .tf::-webkit-scrollbar-thumb:hover,
  .ask::-webkit-scrollbar-thumb:hover, .compose-in::-webkit-scrollbar-thumb:hover,
  .form::-webkit-scrollbar-thumb:hover, .writer::-webkit-scrollbar-thumb:hover,
  .shots-grid::-webkit-scrollbar-thumb:hover {
    background: var(--sand); background-clip: content-box;
  }
  /* A TRAIT THE SHEET ITSELF CAN SHOW IS LIFTED, NOT DOTTED - Babe,
     2026-10-25: "no red dots". It was one fact drawn twice, a brighter label
     AND a red mark after it, which is the two-marks-for-one-state habit this
     page has now unlearned three times. The lift stays and says it once.
     `vis` IS STILL THE DATA: it decides which traits join 02's prompt, and
     after the cut `features` is the only one. */
  .traits-k.vis { color: var(--sand-mid); }

  /* ---- wired state ---- */
  .drop { position: relative; overflow: hidden; }
  /* THE WHOLE THING, NOT A CROP OF IT. A slot is square and a sheet is 16:9,
     and `cover` was quietly hiding half of what you were holding - two panels
     of four, with no sign there were four. It bars out to the plate colour
     instead, which is near enough black to read as nothing. Double-click to
     see it bigger. */
  .drop > img, .drop > video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; display: block;
  }
  /* THE BOX HAS TWO FACES AND SHOWS ONE. Both are full-size drops in the
     same place, so turning it over changes what is in the slot and not the
     size of it. */
  .slot > .drop.alt { display: none; }
  .slot.is-flipped > .drop:not(.alt) { display: none; }
  .slot.is-flipped > .drop.alt { display: grid; }
  /* ONCE THERE IS A PICTURE IN IT THE BOX GOES BLACK. An empty slot is a
     window onto the room and should be; a full one is a frame around a
     photograph, and the bars either side are the photograph's letterbox
     rather than part of the room. It was `--plate`, which is a grey lifted
     off black on purpose so that panels read as panels - right for a surface,
     wrong for the inside of a frame.
     THE RULE LIVES HERE AND NOT WITH THE OTHER FILL RULES: a second copy
     further up the sheet lost to this one on source order and looked like the
     change had simply not worked. */
  /* A FILLED BOX IS THE PICTURE, NOT A FRAME AROUND ONE - Babe, 2026-10-25:
     "can we remove the lighter stroke around the boxes". The lit edge said
     "there is something here", which the something already says; next to a
     picture it read as a border drawn on the work. The resting edge stays, so
     the box still has a shape where the image is letterboxed out. */
  .drop.is-filled, .boardbox.is-filled {
    border-color: var(--edge); background: #000;
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  /* A SLOT THAT IS THINKING RIPPLES. Three red squares leave the middle of
     the box one after another, each starting as a dot and growing out, and
     the words you asked for stay on screen above them. */
  .drop.is-busy { border-color: var(--red); }
  .drop.is-busy .ask { color: var(--sand-dim); }
  .wait {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    display: grid; place-items: center;
  }
  /* IT GROWS TO THE EDGE OF THE BOX, AND THE STROKE DOES NOT GROW WITH IT -
     Babe, 2026-10-26: "i might want to see what the loader looks like
     filling the enter 1:1 square. so maybe its just thicker like 2px square
     outlines that expand all the way to the outer stroke edge of the slot".
     SO IT IS INSET AND NOT `scale`. A transform scales everything it draws,
     the border included - which is why the square used to be at its
     brightest exactly when it was thinnest, and why 2px was needed to see
     anything at all at the start. Animating the four sides inward from the
     centre keeps the line at 2px the whole way out, so what changes is the
     size and nothing else.
     AND IT ENDS AT 0, which is the box's own edge: the last frame of a
     square is the slot's border, drawn in red, going out. */
  .wait i {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    border: 2px solid var(--red);
    /* BACKWARDS, or the delayed ones sit at full size and full opacity until
       their turn comes — which is the sharp square you see on the first
       frame. With it they hold the 0%% keyframe through the delay instead. */
    opacity: 0;
    /* LINEAR, AND THAT IS THE WHOLE OF "NO BOUNCE" - Babe, 2026-10-26:
       "thats cool can you take out the bounce so its just continous loop".
       The easing was an ease-out, so each square left the centre fast and
       crawled the last third - three of them doing that at a stagger reads
       as a pulse rather than as one thing travelling. At a constant rate,
       and with the stagger at exactly a third of the duration, the gap
       between squares never changes and the loop has no seam in it. */
    animation: ripple 2.1s linear infinite backwards;
  }
  .wait i:nth-child(2) { animation-delay: .7s; }
  .wait i:nth-child(3) { animation-delay: 1.4s; }
  /* AND IT HOLDS ITS VALUE INSTEAD OF SPENDING IT AT THE TOP. The square was
     at full opacity for one frame at 14% and decaying for the other 86%, so
     most of what you watched was a square on its way out. */
  /* THE SIZE IS DECLARED AT THE TWO ENDS AND NOWHERE IN BETWEEN, so it
     travels at one rate; the fade in and out are their own stops, which is
     the only thing left shaping the square's life. */
  @keyframes ripple {
    0%   { top: 50%; right: 50%; bottom: 50%; left: 50%; opacity: 0; }
    9%   { opacity: 1; }
    72%  { opacity: .9; }
    100% { top: 0;    right: 0;    bottom: 0;    left: 0;    opacity: 0; }
  }

  /* Reduced motion slows this rather than removing it. Three small squares
     growing in the middle of a slot is not the kind of movement that setting
     exists to prevent, and with nothing moving there is no sign of work. */
  @media (prefers-reduced-motion: reduce) {
    .wait i { animation-duration: 3.6s; }
    .wait i:nth-child(2) { animation-delay: 1.2s; }
    .wait i:nth-child(3) { animation-delay: 2.4s; }
  }

  /* centred in the column with air above and below, rather than filling it
     edge to edge. It is the thing you are looking at, so it gets a margin. */
  /* DEPTH OF FIELD BEHIND THE RESULT. The overlay is a child of the slide,
     not of a plane, so blurring the planes racks focus onto it and leaves it
     sharp. The top bar lives outside the stage, so it is untouched. */
  /* EVERY SLIDE, not just the one holding the result. A neighbour's planes
     are drawn far wider than their own slide and hang into view, so blurring
     only the active slide left the next headline sharp at the right edge. */
  .cam:has(.runover.is-on) .plane {
    filter: blur(9px) brightness(.46);
    transition: filter .45s;
  }
  /* COMING BACK INTO FOCUS IS FASTER THAN GOING OUT OF IT. The rule above
     stops matching the moment the panel closes, so the way back was governed
     by `.plane`'s own filter transition - and that is --plane-fade, 1300ms,
     which exists so a neighbouring slide un-blurs over the length of a
     travel. Here it just felt slow. `is-racking` is put on the camera for the
     length of the rack and taken off again, so only this one return is quick
     and the travel keeps its long ease. */
  .cam.is-racking .plane { transition: filter .17s ease-out; }

  /* centred in the whole stage, not in the panel column — the result is the
     thing you are looking at, so it gets the middle of the screen. */
  .runover {
    /* ONE NUMBER FOR THE PLATE'S INSET, because three things read it now:
       the padding, the room reserved for the foot, and the foot's own
       offsets. `.is-peek` sets `padding: 12px` as a shorthand, which reset
       the reservation and dropped the strip onto the picture - Babe,
       2026-10-27: "yeah the modal is broke". A shorthand cannot reset a
       custom property. */
    --pad: 20px;
    position: absolute; left: 50%; top: 50%; z-index: 8;
    transform: translate(-50%, -50%);
    width: max-content; max-width: min(78vw, 1220px); max-height: calc(100% - 32px);
    display: flex; flex-direction: column; gap: 14px;
    /* a plate to sit the result on, and nothing drawn around it */
    background: rgba(8,9,10,.9); padding: var(--pad);
    /* the foot is out of the flow now (see `.runover-foot`), so its height
       is reserved here instead - `--ctl-h` plus the column gap it used to
       sit after, so nothing moved. */
    padding-bottom: calc(var(--pad) + var(--ctl-h) + 14px);
    /* IT ARRIVES AND IT LEAVES, rather than appearing. `display: none` cannot
       be transitioned, so it is always flex and always laid out - absolutely
       positioned, so that costs nothing - and `visibility` is what takes it
       out of reach. The visibility delay is what makes the exit play: on the
       way out it waits for the scale to finish, on the way in it is zero.
       Scaling from .965 rather than from nothing: the panel grows into place
       instead of zooming at you, and the plate behind it is already blurring
       over .45s, so the two land together. */
    visibility: hidden; pointer-events: none;
    opacity: 0; transform: translate(-50%, -50%) scale(.965);
    /* LEAVING IS FASTER THAN ARRIVING, and it leads with the fade. Something
       on its way out should be out of the way, not performing. */
    transition: opacity .12s ease-in, transform .15s cubic-bezier(.4, 0, 1, 1),
                visibility 0s .15s;
  }
  .runover.is-on {
    visibility: visible; pointer-events: auto;
    opacity: 1; transform: translate(-50%, -50%) scale(1);
    /* and arriving settles rather than stopping: a quint ease-out, most of
       the distance in the first third of 190ms. */
    transition: opacity .13s ease-out, transform .19s cubic-bezier(.16, .84, .44, 1),
                visibility 0s 0s;
  }
  /* NOTHING AROUND THE PICTURE. The page behind is already blurred and dimmed,
     so the result needs no plate, no frame and no caption: the image, the
     buttons, and how long it took. */
  /* THE FOOT IS A STRIP, the same construction as a slot tray: one row the
     width of the picture, cells flush, divided by the border they share. */
  /* AND THE STRIP DOES NOT GET TO SAY HOW WIDE THE PANEL IS - Babe,
     2026-10-27: "seems like the image display is off... like the buttons are
     too long". The panel is `width: max-content` over two children, the
     picture and this row, so the wider of them wins - and the picture is
     capped at `min(70vh, 820px)`, which on a square result is also its
     width. Below about 700px of window height the foot was the wider one and
     a 1:1 result came back with black bars down both sides, which is the
     exact thing content-sizing this panel was introduced to end.
     `width: 0` TAKES THE ROW OUT OF THAT MEASUREMENT and `min-width: 100%`
     puts it back the moment the picture has decided - so the picture is
     always what the panel is as wide as, at every window height rather than
     at the one somebody tuned a padding against.
     AND THE INFO CELL IS ALREADY THE ONE BUILT TO GIVE: `flex: 1 1 0`,
     `min-width: 0`, `overflow: hidden`. So a narrow result shortens what the
     picture IS before it touches a button, which is the right order - the
     buttons are the decisions and the slack cell is slack. `overflow` here
     is the backstop for a result narrower than the three decisions
     themselves, so a label can never paint off the plate. */
  /* THE PICTURE SETS THE WIDTH AND THE STRIP TAKES IT, AND THE FIRST
     VERSION OF THIS ATE A BUTTON. `width: 0; min-width: 100%` keeps the foot
     out of the panel's intrinsic width so a square result stops being as
     wide as its buttons - which worked - but a PERCENTAGE MIN-WIDTH INSIDE A
     `max-content` PARENT IS INDEFINITE while that parent is being measured,
     so Chrome resolves it to zero as often as not. With `overflow: hidden`
     on top, the last cell in the row is not squeezed, it is CLIPPED AWAY:
     Babe, 2026-10-27, "no continue jouirney button", on a foot that stopped
     short of the picture's right edge while every other run had all three.
     SO THE STRIP COMES OUT OF THE FLOW INSTEAD. Absolutely positioned
     against the panel it spans, with the panel reserving its height, the
     width is `left: 0; right: 0` - a resolved length, not a percentage of
     something still being decided - and nothing about it can contribute to
     the measurement it is trying to stay out of. */
  .runover-foot {
    position: absolute; left: var(--pad); right: var(--pad); bottom: var(--pad);
    display: flex; align-items: stretch;
  }
  /* A BIGGER LOOK IS ONLY A LOOK, AND IT STILL SAYS WHAT IT IS - Babe,
     2026-10-26: "but to be able to save and view metadata is nice". The strip
     came off on the argument that there is nothing to act on here, which is
     true of the DECISIONS and not of the row: what the file came back as, and
     a copy of it, are not decisions about the picture. TRY AGAIN and CONTINUE
     JOURNEY stay off - what you are looking at is usually the frame carried
     into this slot rather than this rung's result, and both would answer for
     a run that did not happen here. */
  .runover.is-peek { --pad: 12px; gap: 12px; }
  .runover .row { display: flex; gap: 0; flex: 0 0 auto; min-width: 0; }
  .runover .row > button {
    flex: 0 0 auto;
    /* ONE SIZE FOR EVERY TEXT BUTTON, and this strip was carrying its own
       copy of both numbers - the same literal-twice mistake `--btn-f` and
       `--ctl-h` were introduced to stop. */
    height: var(--ctl-h); padding: 0 20px;
    font-size: var(--btn-f); letter-spacing: .14em;
    border: 1px solid var(--edge); border-left: 0;
    white-space: nowrap;
  }
  .runover .row > button:first-child { border-left: 1px solid var(--edge); }
  /* room for what the picture is, once there is something to say */
  /* IT LEADS THE STRIP NOW, so the edge it gives up is the one on the right -
     the first button restores that seam, exactly as it did when the info cell
     was last in the row. */
  .runover-foot .info {
    flex: 1 1 0; min-width: 0;
    display: flex; align-items: center; gap: 11px; padding: 0 12px;
    border: 1px solid var(--edge); border-right: 0;
    font-family: var(--mono); font-size: 11px; letter-spacing: .05em;
    color: var(--sand-dim); white-space: nowrap; overflow: hidden;
  }
  /* the noun is brighter than the numbers, the way a field's name is
     brighter than its value on the model row. */
  .runover-foot .info b {
    font-weight: 400; color: var(--sand-mid); text-transform: uppercase;
  }
  /* THE RESULT IS SHOWN CLEAN. The screen treatment belongs to the room
     behind the page, not to the thing you are trying to judge — you cannot
     tell whether a face is right through someone else's scanlines. */
  /* THE BOX SIZES TO THE PICTURE. It used to be a flex child stretching into
     the overlay height; once the overlay became content-sized there was no
     height left to take and the result rendered at zero. */
  .runover-media { display: grid; place-items: center; overflow: hidden; }
  .runover-media:empty { display: none; }
  .runover-media img, .runover-media video {
    display: block; width: auto; height: auto;
    max-width: 100%; max-height: min(70vh, 820px);
  }
  .runover-roll { display: none; }
  .runover-msg {
    font-family: var(--mono); font-size: 13px; letter-spacing: .04em;
    color: var(--sand-dim); line-height: 1.6; word-break: break-word;
  }
  /* A FAILURE READS AS ONE - Babe, 2026-10-27: "we should make that text bold
     and all caps". It sits in the same panel as a finished picture and in the
     same mono as the length and the ratio, so at 13px regular it read as
     another readout. The accent was already doing its half. */
  .runover-msg.bad {
    color: var(--red); font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em;
  }
  .runover-msg:empty { display: none; }
  .runover .row { flex: 0 0 auto; }
  .ghost {
    font-family: var(--ui); font-size: 14px; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase;
    background: none; border: 1px solid var(--sand-dim);
    height: var(--ctl-h); padding: 0 24px; cursor: pointer;
    display: inline-flex; align-items: center; transition: background .2s, color .2s;
  }
  /* NO WHITE HOVER - Babe, 2026-10-25, looking at the result foot beside the
     panels built since: "we need to make it more like the newer one in later
     workflows that we did", "i dont think we have white hovers in those".
     We do not: a tray cell lifts its text to sand over a near-black ground,
     and this foot IS a tray - one row of flush cells divided by the border
     they share. Filling a cell with sand made the one you were pointing at
     the brightest thing on a panel whose whole job is to let you judge a
     picture.
     AND THE REST STATE GOES WITH IT. A cell that is already full sand has
     nowhere to go on hover, so these sit at sand-mid like every other cell
     in a strip - which also puts the hierarchy back: CONTINUE JOURNEY is the
     red one, and the rest are what you can also do. */
  .ghost { color: var(--sand-mid); }
  .ghost:hover { color: var(--sand); background: #141212; }
  .run[disabled] { opacity: .45; cursor: default; filter: none; }
  /* Run becomes the clock while the job is out, so the panel never has to be
     covered to tell you something is happening. */
  .run.is-running { opacity: 1; font-family: var(--mono); letter-spacing: .08em; }

  /* the tray: one row of flush cells, no gaps, divided by the border it
     shares with the box above it. */
  .tray {
    display: flex; height: var(--tray-h);
    border: 1px solid var(--edge); border-top: 0;
    background: var(--plate-glass);
  }
  .tr {
    flex: 1 1 0; min-width: 0;
    font-family: var(--mono); font-size: var(--btn-f); letter-spacing: .05em;
    text-transform: uppercase;
    background: none; border: 0; border-left: 1px solid var(--edge);
    color: var(--sand-mid); cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color .18s, background .18s;
  }
  .tr:first-child { border-left: 0; }
  /* AND `:first-child` IS THE ARROW, WHICH IS USUALLY NOT THERE. Every tray
     carries the way-back cell and the header in front of its buttons, and on
     a plain picture face both are display:none - so the rule above lifted the
     divider off a cell nobody can see while the first cell you CAN see drew
     one straight on top of the tray's own left border. Babe, 2026-10-25:
     "i think im seeing a double line on the left side of import on both slot
     panels". Measured at 1745 wide: the tray's edge at x 876.9 and IMPORT's
     at 877.8, 0.9px apart.
     THE FACES ARE ENUMERATED BECAUSE CSS CANNOT SAY "the first one that is
     displayed", and these four are exactly the ones that show either of the
     two cells in front - a fifth face would have to be added here, which is
     the price of not keeping this in a class that JS has to remember to
     toggle. */
  .slot:not(.is-asking):not(.has-form):not(.is-inface):not(.is-describing):not(.is-agent):not(.is-writing)
    .tray > .tr.back + .tray-k + .tr { border-left: 0; }
  /* AND THE FIFTH FACE ARRIVED, EXACTLY AS THE NOTE ABOVE SAID IT WOULD -
     Babe, 2026-10-27: "i thought we fixed this before but the left line on
     prompt tab is a double line". A slot with a DRAWN BOARD is a form slot
     at rest: the back cell and the header are both hidden, so PROMPT is not
     `:first-child` and draws its own left border a pixel inside the box's.
     `has-form` is excluded above because a form at rest really does show
     `‹ SINGLE SHOT PROMPT`, so the exclusion was right and incomplete - the
     board is the one state where a form slot has no arrow in front of it. */
  .slot.has-form.has-board:not(.is-editing):not(.is-asking):not(.is-inface):not(.is-agent)
    .tray > .tr.back + .tray-k + .tr { border-left: 0; }

  /* WHILE YOU ARE WRITING, THE TRAY IS A DIFFERENT BAR. Import and Random
     would both throw the sentence away, so they are not offered: the row
     becomes a GENERATE header and one Run button, and the corner X is the
     way back. */
  /* AND `is-agent` IS A FACE IN ITS OWN RIGHT, FROM 2026-10-26. It was
     never in any of these lists because it could not be reached without one
     of them: on 01 the agent is a second face of the writing box and on 04 a
     second face of the form, so one of `is-asking` / `is-inface` was always
     on underneath it. 05's box IS the rung's prompt - there is no face above
     the agent to be one level inside of - and the row came up with no header
     and no way back. The fifth face is the price this list already named. */
  .tray-k { display: none; }
  .slot.is-asking .tray-k,
  .slot.has-form .tray-k,
  .slot.is-inface .tray-k,
  .slot.is-agent .tray-k,
  .slot.is-writing .tray-k,
  .slot.is-describing .tray-k {
    display: flex; align-items: center; flex: 1 1 auto; min-width: 0;
    /* A FLEX CONTAINER TRIMS THE SPACE BETWEEN A TEXT RUN AND AN ELEMENT, so
       "Model : <b>NAME</b>" rendered as MODEL :NAME - the gap puts it back
       rather than a non-breaking space, which is what the param row does. */
    gap: 6px; padding: 0 13px;
    /* THE HEADER IS A CELL IN THE SAME ROW, SO IT IS THE SAME TYPE - Babe,
       2026-10-25: "can we make the headers the same font / size as the tab
       text". It was the last 13.5px literal left in the page: `--btn-f` was
       introduced to stop "make them the same" and "make them smaller" being
       two edits in two places, and the param row and the tray cells both
       moved to it while this one did not. A header that is a pixel and a
       half larger than the buttons beside it reads as a different kind of
       thing, which it is not - it names where you are standing in the row it
       is standing in. The brightness stays: that is the state, not the type. */
    font-family: var(--mono); font-size: var(--btn-f); letter-spacing: .05em;
    text-transform: uppercase; color: var(--sand-dim);
    /* it is the cell that gives up room when a neighbour needs it, so it has
       to give up room rather than grow a second line. */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* THE BRIGHT HEADER WAS THE PANEL NAMING ITSELF, AND THE PANEL STOPPED
     NAMING ITSELF - Babe, 2026-10-26, on the row reading PROMPT: "i think
     its too bright currently". It said DIRECTION in sand because that was
     where you were standing, which is a state; PROMPT at rest is the home
     face every other slot writes in `--sand-dim` plain, so there is nothing
     for the lift to mean. Inside a face it still means something, and
     `is-inface` already carries that rule. */
  /* NOT THE AGENT'S - see the face handler. `faceHead` still marks which
     half of `‹ STYLE AGENT` is the face, because the markup is how a rule
     would ever reach it; nothing colours it differently any more. */
  .slot.is-asking .tr[data-act="import"],
  .slot.is-asking .tr[data-act="random"] { display: none; }
  .slot.is-asking .tr[data-act="prompt"] {
    flex: 0 0 auto; padding: 0 26px;
    background: var(--red); color: var(--ink); border-left: 0;
  }
  .slot.is-asking .tr[data-act="prompt"]:hover { background: #ff3b3c; color: var(--ink); }
  /* AND IT IS NOT THERE AT ALL WHERE NOTHING IN THE TRAY RUNS THE BOX. The
     red cell is the one that generates what you wrote; under a `writes` mode
     the rung's RUN does that, which left this cell meaning only "go back" -
     the same thing the arrow beside the header already means. A slot with
     two actions where one of them is the real one is what took BACK TO 0N
     off the held slots. The cell comes back the moment the face closes,
     because closed it is the way in. */
  .slot.is-asking.writes .tr[data-act="prompt"] { display: none; }
  /* NO X ON A PANEL - Babe, 2026-10-25: "the x is for the images to remove
     those. but not close a panel". It was carrying two unrelated meanings on
     two different faces of the same slot, which is why it kept needing to be
     explained. The way out of a panel is the header, with the chevron the
     agent face already uses. */
  .slot.is-asking > .clr { display: none; }
  /* AND THE HEADER IS ONLY THE WAY OUT WHERE THERE IS ONE. At rest on a
     writing slot it names the face you are already standing in, so it is a
     label and not a press - the arrow appears with the agent. */
  .slot.is-writing:not(.is-agent) .tray-k { cursor: default; }
  .slot.is-asking .tray-k,
  .slot.is-describing .tray-k,
  .slot.is-inface .tray-k { cursor: pointer; transition: color .15s; }
  .slot.is-asking .tray-k:hover,
  .slot.is-describing .tray-k:hover,
  .slot.is-inface .tray-k:hover { color: var(--sand); }
  /* the cell, sized to its glyph and nothing more */
  .tr.back { display: none; flex: 0 0 auto; padding: 0 10px; font-size: 16px; }
  /* AND THE NAME SITS NEXT TO THE ARROW, NOT ACROSS A FIELD FROM IT - Babe,
     2026-10-25: "the < PROMPT.. there is a big gap can we close that gap",
     then again at 16px: "can we make the gap less between the < and
     headers... so it's like < STYLE PROMPT". Which names the target exactly -
     the arrow and the name are one address, so what belongs between them is
     a word space and not a cell's worth of padding.
     It was two paddings and a divider doing their jobs separately: 15px off
     the back cell and 13px off the header put 29px between the glyph and the
     P, which on a cell sized to one character reads as a gap rather than as
     spacing. 16px was still two paddings; it is ONE now, 6px, carried by the
     arrow's own cell - and the header gives up its left padding entirely,
     because a cell that starts with nothing in front of it cannot disagree
     with the cell before it about how far apart they are.
     THE ARROW KEEPS ITS LEFT PADDING, so the glyph still starts where every
     other tray's first cell starts; only the side facing the name came in.
     Both rules are scoped to an arrow that is actually in front of a header -
     every other tray keeps the padding it was given.
     AND "IN FRONT OF" HAS TO MEAN ON SCREEN, NOT IN THE MARKUP - Babe,
     2026-10-26, on 04's row: "this prompt header looks wrong tho". The arrow
     is a cell on every tray and `display: none` on most of them, and `+`
     does not care: 04's panel has no way out to draw at rest, so PROMPT was
     giving up its left padding to a glyph that was not there and sitting
     flush against the edge of the row. The three states that show the arrow
     are the three that may take the padding off. */
  .slot.is-asking .tray .tr.back + .tray-k,
  .slot.is-describing .tray .tr.back + .tray-k,
  .slot.is-agent .tray .tr.back + .tray-k,
  .slot.is-inface .tray .tr.back + .tray-k { padding-left: 0; }
  .tray .tr.back:has(+ .tray-k) { padding-right: 6px; }
  .slot.is-asking .tr.back,
  .slot.is-describing .tr.back,
  .slot.is-agent .tr.back,
  .slot.is-inface .tr.back { display: block; }
  /* INSIDE A FACE, THE ROW IS THAT FACE'S OWN - the nesting the panels on 04
     already use: the header names where you are standing and takes you back,
     and the two cells that got you here go away, because you are now in one
     of them. Babe, 2026-10-25: "think nesting panels still when you go into
     one the bottom choices change". */
  .slot.is-inface .pick { display: none; }
  /* AND THE CAMERA IS A FACE LIKE ANY OTHER - Babe, 2026-10-26: "when you
     press webcam the bottom panel needs to change with < WEBCAM header.. and
     then record button". It was the last cell on the rail that renamed
     itself: WEBCAM became CAPTURE and then STOP, which is a cell saying what
     pressing it does next in the row that is supposed to say where you are.
     `is-cam` rides with `is-inface`, so the header, the arrow and the
     padding between them are the ones every nested face already has, and the
     only cells left are the way back and the one that acts. */
  /* AND IT IS SCOPED TO THE TRAY, BECAUSE A TAB IS A `.tr` TOO - Babe,
     2026-10-26, with the slot standing a strip short of its neighbour:
     "web cam is changing the size of the panel", "the top tabs should
     stay". `modeTabs` writes `class="tr ftab"`, so an unscoped rule about
     the cells in the row at the BOTTOM took the row at the TOP with it -
     the one row on this rail that never changes height for anyone, and the
     reason both columns end on the same line. The same unscoped-hide
     mistake `.writer .ftabs` already paid for once. */
  .tray .tr.camgo, .tray .tr.camr { display: none; }
  .slot.is-cam .tray .tr.camgo { display: block; flex: 0 0 auto; padding: 0 22px; }
  .slot.is-cam .tray .tr:not(.camgo):not(.camr):not(.back) { display: none; }
  /* THE ROW SAYS WHICH QUESTION IS OPEN. While the camera is looking at you
     the only thing to do is take one; once you have, the only things to do
     are take another or keep it - so the cell that shoots goes and the two
     that decide arrive. Never both: a row with CAPTURE beside USE would be
     asking two questions about one picture. */
  /* AND FLIP STAYS ON A TAKE - Babe, 2026-10-27: "we prob should still add the
     flip option in this view too". It was hidden the moment there was a take,
     which was hiding a control that works: `paintFlip` transforms `.cam-shot`
     by name and `cutTake` draws a flipped take through a canvas with its audio
     carried across, so the mirror has always applied to the thing you are
     looking at as well as to the preview. The cell is empty until there is
     something to mirror, and the rule below takes care of that. */
  /* AND AN EMPTY CELL IS NOT A CELL. The face can now be entered before the
     camera is, and FLIP is a decision about a live preview - so until there
     is one the cell has no word in it and should not be drawing a divider.
     The same `:empty` test the message line under the traits card uses. */
  .slot.is-cam .tray .tr.camgo:empty { display: none; }
  .slot.is-cam.is-shot .tray .tr.camr { display: block; flex: 0 0 auto; padding: 0 22px; }
  /* AND A STILLS SLOT ASKS A SHORTER QUESTION - Babe, 2026-10-27: "we dont
     need the same options or countdown for the webcam". The count went, and
     SAVE went with it on the argument that a frame grabbed to be 01's source
     is an input on its way into a job rather than work worth filing.
     AND SAVE CAME BACK THE SAME DAY - Babe, looking at the take: "we'll also
     want a save button". A PHOTOGRAPH OF YOU IS WORK TOO. The camera is the
     one thing on this rail that makes something no model can make again, and
     the rung it feeds writes its OUTPUT to output/ - never its input - so
     without this cell the only copy of the frame you just liked dies with the
     next RETAKE. It needed no code: `cutTake` hands a still straight back
     untouched and the download already names a .png, so the cell has been
     wired the whole time and was only hidden.
     AND THE SHUTTER STILL GOES THE MOMENT THERE IS SOMETHING TO DECIDE ABOUT, which
     is the never-both rule above arriving on the other kind of camera. On a
     clip slot the cell is FLIP and stays, because mirroring is a decision
     about the take; on a stills slot the cell IS the shutter, and CAPTURE
     beside USE is exactly the two-questions-about-one-picture that rule
     exists to forbid. RETAKE is how you shoot another, which is the word. */
  .slot.is-cam.is-stills.is-shot .tray .tr.camgo { display: none; }
  /* THE COUNT IS OVER THE PICTURE, NOT BESIDE IT - "we may need a countdown".
     It is the headline face at the size the numeral is drawn in, because this
     is the one moment on the rail where a number is the whole screen. The ink
     under it is the same scrim the plate uses, so the preview reads through
     it rather than being replaced by it. */
  .cam-count {
    position: absolute; inset: 0; z-index: 4; display: grid; place-items: center;
    font-family: var(--display); font-weight: var(--head-weight); font-size: 96px;
    line-height: 1; color: var(--sand); background: rgba(8,9,10,.42);
    pointer-events: none; user-select: none;
  }
  /* AND WHILE IT ROLLS THE SAME MARK IS A CLOCK, in the corner, out of the
     way of the performance you are watching yourself give. */
  /* THE CUT WEARS THE COUNTDOWN'S TREATMENT at a size a word can live at.
     A number is the whole screen; a word is read, so it is smaller and
     tracked out rather than set at 96px. */
  .cam-count.word { font-size: 34px; letter-spacing: .14em; text-transform: uppercase; }
  .cam-count.tick {
    place-items: start; padding: 12px 14px; background: none;
    font-family: var(--mono); font-size: 13px; letter-spacing: .06em; color: var(--red);
  }

  /* TWO HANDLES ON THE TAKE - Babe, 2026-10-27: "we may want to make a simple
     trim in and out handles to cut off anything we dont want to use". A take
     always has a second of reaching for the keyboard at each end, and this
     rail asks for four to ten seconds, so the difference matters.
     IT IS THE PROGRESS RULE'S CONSTRUCTION: a line the width of the picture,
     the kept part lit in red and the rest left as the seam it already was. No
     box, no panel - the take is the thing you are looking at and this is a
     mark on it. */
  /* AND THE TRANSPORT IS OURS - Babe, 2026-10-27: "the playback panel can be
     custom". The native control bar was the only piece of browser UI on this
     page, with its own type, its own grey and a kebab menu offering to
     download the take. It is one strip: a play cell, the line, and how long
     the take is. The line IS the trim - there is no second scrubber, because
     what you are setting and what you are watching are the same range. */
  /* IT IS A PANEL, NOT A FADE - Babe, 2026-10-27: "we may want to use a dark
     panel behind it so it doesnt blend with the black letterbox, maybe like we
     do for the agent panel". A take is `contain`-fitted, so the strip usually
     lies over bars of pure black and a gradient to transparent had no edge to
     start at. It is the agent panel's own ground and its own border, which is
     what this page already uses for a surface laid over something else. */
  .cam-trim {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    background: var(--plate-glass); border-top: 1px solid var(--edge);
    font-family: var(--mono); font-size: 12px; color: var(--sand-mid);
    touch-action: none; user-select: none;
  }
  /* AND WHILE IT CUTS, THE STRIP SAYS SO. The cut is the take played into a
     second recorder in real time, so without a word for it the only thing on
     screen is a video playing - which is what USE and SAVE looked like they
     did. Babe: "when you press use it just plays the video", "and save just
     plays it too". The handles go, because there is nothing to set while it
     runs, and the row below cannot be pressed twice. */
  /* LIVE, THE WHOLE TRANSPORT IS THERE AND DIM - Babe, 2026-10-27: "lets keep
     the transport panel so theres's no change in the ui", "we can just dim the
     play, etc until you capture". Hiding the play cell and the line was the
     honest version of "nothing to play yet" and it was still a change in the
     panel at the moment you are judging a performance. Dimming says the same
     thing and moves nothing.
     RECORD STAYS LIT, because it is the only thing there is to do yet; the
     mirror moved to the row below with the cell recording left behind. */
  .cam-trim.is-live .pp, .cam-trim.is-live .bar, .cam-trim.is-live .t {
    opacity: .28; pointer-events: none;
  }
  .cam-trim.is-live .t.is-rolling { opacity: 1; color: var(--red); }

  .cam-trim.is-cutting .h { display: none; }
  .cam-trim.is-cutting .pp { opacity: .3; pointer-events: none; }
  .slot.is-cutting .tray .tr.camr { color: var(--sand-dim); pointer-events: none; }
  .cam-trim .pp {
    flex: 0 0 auto; width: 16px; height: 16px; padding: 0; border: 0;
    background: currentColor; color: var(--sand); cursor: pointer;
    -webkit-mask: var(--play) center / contain no-repeat;
    mask: var(--play) center / contain no-repeat;
  }
  .cam-trim .pp.is-on {
    -webkit-mask-image: var(--pause); mask-image: var(--pause);
  }
  .cam-trim .bar {
    position: relative; flex: 1 1 auto; height: 20px; cursor: pointer;
  }
  /* THE LINE STANDS AS TALL AS THE MARKS ON IT - Babe, 2026-10-27: "make the
     timeline thin bar the same height as the handles / playhead". A 2px rule
     with 16px ticks on it reads as two drawings; at one height it is one
     object, a band with the kept part lit and the rest left dark. */
  .cam-trim .bar::before {
    content: ''; position: absolute; left: 0; right: 0; top: 2px; height: 16px;
    background: var(--edge);
  }
  .cam-trim .kept { position: absolute; top: 2px; height: 16px; background: var(--red); }
  /* THE PLAYHEAD AND THE HANDLES STAND THE SAME HEIGHT - Babe: "make the
     playhead the timeline, playhead and handles the same height". They are
     marks on one line and three different heights read as three different
     kinds of thing. They differ in weight instead: the playhead is a hairline
     because it is where you are, the handles are twice that because they are
     what you set. */
  .cam-trim .at { position: absolute; top: 2px; width: 1px; height: 16px; background: var(--sand); }
  /* A HANDLE IS BIGGER THAN IT LOOKS, because it is dragged: two pixels of
     line to read and twenty of nothing to grab. */
  .cam-trim .h {
    position: absolute; top: 0; width: 20px; height: 20px; margin-left: -10px;
    cursor: ew-resize;
  }
  .cam-trim .h::before {
    content: ''; position: absolute; left: 9px; top: 2px; width: 2px; height: 16px;
    background: var(--sand);
  }
  .cam-trim .h:hover::before, .cam-trim .h.is-held::before { background: var(--red); }
  /* RECORD IS A RED CIRCLE AND IT LEADS - Babe, 2026-10-27: "add a red circle
     to record next to play", "record on the left". It is the one press on this
     strip that makes something, so it wears the accent and sits where the eye
     starts. While it rolls it is a square, which is what a stop button has
     looked like since tape. */
  .cam-trim .rec {
    flex: 0 0 auto; width: 15px; height: 15px; padding: 0; border: 0;
    border-radius: 50%; background: var(--red); cursor: pointer;
    transition: border-radius .18s;
  }
  .cam-trim .rec:hover { filter: brightness(1.15); }
  .cam-trim .rec.is-rolling { border-radius: 2px; }
  /* and once there is a take, the thing to do is decide about it */
  .cam-trim:not(.is-live) .rec { opacity: .28; pointer-events: none; }
  /* THE MIRROR IS THE FACE'S OWN CELL NOW, in the row below, so a pressed
     state there is the same sand fill every on/off cell on this page wears. */
  .slot.is-cam .tray .tr.camgo.is-on {
    background: var(--sand); color: var(--ink); border-color: var(--sand);
  }
  .cam-trim .t { flex: 0 0 auto; letter-spacing: .04em; white-space: nowrap; }
  /* a take whose container has no duration cannot be seeked, so it cannot be
     trimmed either - it keeps the transport and loses the handles */
  .cam-trim.no-seek .h, .cam-trim.no-seek .kept { display: none; }
  /* ROLLING IS A STATE AND THE PAGE ALREADY DRAWS IT: `.tr.is-live` is the
     filled red cell, written for the agent's RUN. A recorder that keeps
     running after you take your finger off the button is the same kind of
     fact, so it wears the same mark rather than a second one. */
  /* AND THE CAMERA IS NOT OFFERED WHILE YOU ARE WRITING, for the same reason
     IMPORT is not: the box IS the sentence, and a preview would be over it. */
  .slot.is-asking .tr[data-act="webcam"] { display: none; }
  /* AND A HEADER THAT IS TWO WORDS READS AS ONE ADDRESS - Babe, 2026-10-26:
     "i think SINGLE SHOT PROMPT header should be the same color", pointing at
     01's `‹ STYLE PROMPT`, where both halves sit at `--sand-dim`. The lift
     belongs to a header that is ONLY the face's name - 06's CHARACTER and
     LOCATION, where there is nothing beside it to be brighter than. On a
     slot with a form the header is mode plus face, and lifting one half
     splits an address that is meant to be read in one go. */
  /* THE `b` IS AN ADDRESS, NOT AN EMPHASIS - Babe, 2026-10-26: "are we using
     different weights on the text can it be the same". It marks which part of
     the header is the face so a rule can colour it; the tag's own bold was
     never asked for, and on `‹ SINGLE SHOT PROMPT` it split one address into
     two voices. Weight is the row's, colour is the state's.
     IT WAS ALREADY WRITTEN TWICE as `font-weight: 400` beside each colour
     lift - true wherever a lift happened and nowhere else, which is how a
     header with no lift kept the bold. */
  .tray-k b { font-weight: 400; }
  .slot.is-inface:not(.has-form) .tray-k b { color: var(--sand); }
  /* REPLACE and DESCRIBE would both leave the card, so while it is open the
     row belongs to the card: a TRAITS header, AUTO and SAVE.
     AND THE WAY OUT IS THE ARROW, NOT THE CORNER - Babe, 2026-10-25: "remove
     the x on the traits panel. add spacing on the traits header with the <
     TRAITS to go back". Which is the rule the writing face and the nested
     panels already settled: an X in the corner of a box means throw this away
     on every other slot, and here it meant step out one level. The card is a
     face of this slot, so it leaves by the header like every other face. */
  /* REPLACE IS IMPORT EVERYWHERE NOW - Babe, 2026-10-26: "we might want to
     change the word REPLACE to IMPORT so its consistent". A held slot called
     it REPLACE because something is already in it, which is a distinction the
     tray does not need to draw: the cell opens a file chooser and the box
     ends up holding what you chose, on a full slot as on an empty one. Four
     slots said REPLACE and every other one said IMPORT for the same press.
     The act id follows the label, so these became `import`. */
  .slot.is-describing .tr[data-act="import"],
  .slot.is-describing .tr[data-act="describe"] { display: none; }
  /* THE ROW BELONGS TO THE AGENT WHILE IT IS OPEN - Babe, 2026-10-24: "on
     the left its a header that says AGENT, on the right ther will be a button
     for run and cancel". Which is the traits card's row again: the cell that
     opened the panel steps out, a header names what the row is for now, and
     the two ways out each say what they do. SEND talks to it, RUN takes what
     it came up with. */
  .tr[data-act="agentrun"] { display: none; }
  .slot.has-form .tr[data-act="agentrun"] {
    display: block; flex: 0 0 auto; padding: 0 26px;
  }
  /* THE HEADER IS THE WAY BACK, and it carries an arrow to say so - Babe,
     2026-10-25: "add an arrow next to single to go back < SINGLE - instead of
     the x in the corner". Which is better than the corner for a nested panel:
     an X in the corner of a box means throw this away on every other slot,
     and here it meant step out one level. The header already names the level
     you are on, so putting the way back on it costs nothing and says where
     you are going. One level at a time: < AGENT returns to the writing face,
     < SINGLE leaves the section. */
  /* only the agent face is a step in, so only it offers a step back */
  /* ONE ARROW, NOT TWO. The agent header draws its own `::before` chevron,
     from when that header WAS the way back; a writing slot already has the
     arrow as a cell of its own, and on its agent face both were showing -
     "‹ ‹ AGENT". The cell wins, because that is the whole reason it was
     made a cell. */
  /* AND THE HEADER'S OWN CHEVRON IS GONE, 2026-10-26. It was written when
     the header WAS the way back, and it has been drawn over by the cell on
     every face that has one since - which was three states, enumerated here
     and again in the exemption below it. `is-agent` is the fourth, and with
     that the cell shows wherever the agent does: there is no face left for
     the header's glyph to be the only arrow on, so the rule and the list of
     exceptions to it both go. A mechanism that existed to stop two things
     disagreeing outlived one of them - the same shape `faceModel` had. */
  .slot.is-agent .tray-k { cursor: pointer; transition: color .15s; }
  .slot.is-agent .tray-k:hover { color: var(--sand); }
  .tr[data-act="autotraits"], .tr[data-act="savetraits"],
  .tr[data-act="cleartraits"] { display: none; }
  .slot.is-describing .tr[data-act="autotraits"],
  .slot.is-describing .tr[data-act="savetraits"],
  .slot.is-describing .tr[data-act="cleartraits"] {
    display: block; flex: 0 0 auto; padding: 0 26px;
  }
  .slot.is-describing > .clr { display: none; }
  .tr:hover { color: var(--sand); background: #141212; }
  .tr[aria-pressed="true"] { background: var(--sand); color: var(--ink); }
  .tr:focus-visible { outline: 1px solid var(--red); outline-offset: -2px; }
  /* A DIMMED CELL, NOT A DIMMED DIVIDER - Babe, 2026-10-25: "i would like
     the vertical lines like this one to not be dimmed more than the others".
     Each cell carries the line on its own left edge, so fading the cell with
     `opacity` faded the line with it and the row got a weak seam wherever a
     cell happened to be off. Dimming the text instead leaves the grid alone:
     the lines are the row's structure and they do not have a state. */
  .tr[disabled] { color: var(--sand-dim); cursor: default; }
  .tr[disabled] b { color: var(--sand-dim); }
  /* THE PANEL'S RUN IS THE ACTION ON THIS PANEL, so it wears the same accent
     the rung's own RUN does rather than being red text in a row of cells.
     Red lettering reads as a warning; the filled cell reads as the button
     you came here to press. */
  /* A BUTTON THAT RENAMES ITSELF MUST NOT RESIZE - Babe, 2026-10-25: "i
     noticed a shift happen in the UI here", on RUN becoming DRAWING mid-job.
     The tray shares its width by flex, so three letters becoming seven took
     the room out of the header beside it and MODEL : NANO-BANANA-2.1 wrapped
     onto a second line while the job ran. Sized to the longest thing it ever
     says, which is the same rule the param row's `ch` widths follow. */
  .tr[data-act="agentrun"] { flex: 0 0 auto; min-width: 11ch; }
  /* AND IT GIVES THE ACCENT UP WHEN IT IS DONE - Babe, 2026-10-25: "now we
     want to dim that run button". The lit button is wherever the work is, and
     once a board exists the work is the rung's RUN below. It stays pressable,
     because redrawing the board is a thing you may well want; it just stops
     being the thing the page is pointing at. */
  .slot.has-board .tr[data-act="agentrun"].is-live {
    background: transparent; color: var(--sand-dim);
  }
  .slot.has-board .tr[data-act="agentrun"].is-live:hover {
    background: #141212; color: var(--sand); filter: none;
  }
  .tr.is-live {
    background: var(--red); color: var(--sand);
    transition: filter .18s, background .18s, color .18s;
  }
  .tr.is-live:hover { background: var(--red); color: var(--sand); filter: brightness(1.14); }

  /* the prompt is another input, so its header is the same header */
  /* the same settings: it is the third header in the column and the three
     have to agree. WAS: 14px, 600, .18em. */
  .agent-k {
    font-family: var(--label);
    font-size: 15px; font-weight: 500; letter-spacing: 0; text-transform: uppercase;
    color: var(--sand); margin-bottom: 11px;
  }
  /* THE WHOLE LINE WEARS THE CALL-OUT TREATMENT - Babe, 2026-10-25: the
     call-out face, "all caps". Uppercase is a text-transform, so the strings
     underneath are untouched and this is a look to judge rather than a copy
     change. NOTE IT IS EVERY RUNG'S PROMPT LINE, not just 04's - one
     component, so trying it on one slide only would tell you nothing.
     WAS: 16px, var(--ui) inherited, sentence case, no tracking. */
  .agent-v {
    /* THE SAME SIZE AS THE CALL-OUTS - Babe, 2026-10-25: "can we make the
       text under prompt the same size as the callouts". It was 14px against
       their 13, and it reads at the same tracking in the same case, so the
       one pixel of difference was not telling anyone anything. Both now come
       off --call-f: the line the agent writes and the notes about it are the
       same register, and only the headline and the slot labels are bigger. */
    font-size: var(--call-f); line-height: 1.75; letter-spacing: .14em;
    text-transform: uppercase; color: var(--sand-mid);
    padding-bottom: 10px; transition: color .2s;
  }
  /* NO FOCUS STATE: it is a sub-header now, so it does not take a caret and
     the rule under it stops lighting up as a field. */
  .agent-v { cursor: default; }
  /* AN EMPTY LINE SAYS WHAT BELONGS IN IT, the way every other writing
     surface on this page does. Under 01's EDIT tab there is no sentence
     anyone but the artist can write, so the line is empty there and this
     stands in it. */
  .agent-v:empty::before { content: attr(data-ph); color: var(--sand-dim); }
  /* A FIELD IS NAMED HERE, NOT QUOTED - Babe, 2026-10-25: "the motion prompt
     should have the preface and then ACTION in red or something, without
     repeating the prompt". The line was printing the sentence you had just
     typed six inches above it, so one screen said one thing twice. The chip
     stands where the words will go and the words are put back at run time,
     which also means the line keeps up with the form without being rewritten
     under your cursor. It is the accent because it is the only thing on this
     line that is not literally what gets sent. */
  /* NO BOX - Babe, 2026-10-25: "keep the text light... make the word action
     the orange tho. no square". Drawn as a bordered chip it read as a control
     sitting in a sentence, which invites a click that does nothing. It is a
     word in a line; the accent is enough to say it stands for something else.
     AND THE MODE IS NOT ACCENTED, because it is not standing in for anything -
     it says what kind of shot this is and resolves to nothing. Only the words
     that will be replaced are orange. */
  /* TRYING THE CALL-OUT FACE ON IT - Babe, 2026-10-25: "can we make this the
     same font we have on the left for a second to see what it looks like".
     That is `.call` on FORE: Archivo uppercase, 13px, .14em. Which has an
     argument behind it - the chips and the call-outs are both the page
     annotating itself rather than words the model will read.
     WAS: var(--mono), 12px, .08em letter-spacing. */
  .tok {
    font-family: var(--ui); font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--red); white-space: nowrap;
  }
  .tok[data-tok="mode"] { color: inherit; }
  /* THE RULE UNDER THE PROMPT IS THE PROGRESS BAR. It is already a line in
     the right place, so running fills it rather than putting a second bar
     somewhere else. */
  .prog { height: 2px; background: var(--edge); overflow: hidden; }
  /* see slotHTML: it hangs under the bar and costs the layout nothing. */
  .wantline { height: 0; overflow: visible; }
  .wantline b {
    display: block; transform: translateY(10px);
    font-family: var(--mono); font-size: 11px; font-weight: 400;
    letter-spacing: .06em; text-transform: uppercase; color: var(--red);
  }

  .prog i {
    display: block; height: 100%; width: 0; background: var(--red);
    transition: width .35s linear;
  }
  .prog.is-done i { transition: width .2s ease-out; }

  /* AND IT HANGS OFF THE BOTTOM, THE WAY `.scene-k` HANGS OFF THE TOP. The
     panel is annotated at both ends now and the two ends are fixed: the row
     is the lowest edge the panel draws, so it belongs on the line the page
     ends on rather than wherever a rung's content leaves it.
     IT ALSO STOPS RUN MOVING BETWEEN SECTIONS. `.mid-col` centres, and no two
     rungs have the same content height - a sheet picker is not a webcam box -
     so the one button that does the same thing everywhere was in a different
     place on every section. Out of flow it is in one place on all six.
     THE PAIR IS STILL CENTRED ON THE WHOLE COLUMN, which is deliberate for
     now: an absolutely positioned child is not a flex item, so taking the row
     out changed where the slots sit by nothing at all. */
  .row { display: flex; align-items: center; gap: 7px; }
  /* AND THE PIN IS `.mid-col >`, NOT `.row`. The result panel's foot is a
     `.row` too - one strip of cells under the picture - and an unscoped
     position would have hung it off the bottom of the stage the moment the
     modal opened. `.runover .row` wins on specificity for everything it
     declares, and it declares no `position`, so nothing would have caught it
     but the modal itself looking wrong. */
  .mid-col > .row {
    position: absolute; left: 0; right: 0; bottom: var(--rim-y);
  }
  /* one strip, the way a slot tray is one strip: the cells share their
     borders instead of each carrying its own. Run stays detached — it is the
     action, not another setting. */
  .params { display: flex; gap: 0; flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; }
  .params > .param { border-left: 0; }
  /* A hovered cell has no left border of its own — its left edge belongs to
