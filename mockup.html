       without touching `.say`, so the box kept whatever the FORM last
       composed into it - "Lens: 24mm." - and CUSTOM then sent that as the
       artist's own words.
       THE FORM OWNS A COMPOSED SENTENCE AND CUSTOM OWNS A TYPED ONE, so the
       box holds whichever belongs to the tab you are on: leaving CUSTOM puts
       what you wrote on the slot, arriving on it hands it back, and arriving
       anywhere else lets `composeDirection` write the form's. An empty box
       shows the placeholder, which is what a blank CUSTOM should look like. */
    var sayBox = slot.querySelector('.say');
    if (sayBox && slot.classList.contains('has-form')) {
      var hasForm = function (k) {
        return !!slot.querySelector('.form[data-form="' + k + '"]');
      };
      if (!hasForm(slot.dataset.mode)) slot.dataset.custom = sayBox.textContent;
      if (!hasForm(tab.dataset.mode)) sayBox.textContent = slot.dataset.custom || '';
    }
    slot.dataset.mode = tab.dataset.mode;
    /* AND THE PROMPT LINE FOLLOWS THE TAB, unless the artist has made it
       theirs - the same pin `.agent-v` already honours against 04's form, so
       a sentence you typed survives a look at the other tab. */
    /* THE SLOT CARRIES THE ANSWER, because CSS has to gate RUN on it and a
       stylesheet cannot read the pressed tab's attributes from the slot. */
    slot.classList.toggle('writes',
      'writes' in tab.dataset || slot.dataset.writes === '1');
    slot.classList.toggle('needs-words', 'needs' in tab.dataset);
    /* THE FACE SURVIVES THE PRESS and asks the new mode's question in the
       same box - one slot, one sentence, a different job for it. */
    if (slot.classList.contains('is-asking')) {
      /* `box`, NOT `ask` - the local that stood on `function ask` cost a day
         on 2026-10-29 and this is the same word in the same file. */
      var box = slot.querySelector('.ask');
      if (box && tab.dataset.ask) box.dataset.ph = tab.dataset.ask;
      if (window.HJ && window.HJ.faceHead) {
        window.HJ.faceHead(slot, slot.classList.contains('is-agent') ? 'Agent' : 'Prompt');
      }
    }
    if ('line' in tab.dataset) {
      var side = slot.closest('.slide');
      var line = side && side.querySelector('.agent-v');
      if (line && line.dataset.by !== 'artist') {
        /* innerHTML, because a mode's line may be chips rather than a
           sentence - the same shape motionLine writes on 04. */
        line.innerHTML = tab.dataset.line;
        if (tab.dataset.ph) line.dataset.ph = tab.dataset.ph;
        else delete line.dataset.ph;
      }
    }
    /* composing a direction is 04's job and only 04 has a form to compose
       from; a tabbed slot elsewhere just wears what the strip says. */
    if (slot.classList.contains('has-form')) composeDirection(slot);
  });

  /* THE HEADER IS THE WAY BACK, from the agent and from a drawn board. */
  document.addEventListener('click', function (e) {
    /* the header or the arrow beside it - the same way out, and the arrow
       is the one that still means it once the header names a model. */
    var k = e.target.closest && e.target.closest('.tray .tray-k, .tray .tr.back');
    if (!k) return;
    var slot = k.closest('.slot');
    /* AND THE BOX FACE LEAVES BY THE SAME ARROW, one level at a time. It is
       a face, so the arrow has to claim the press here too - otherwise it
       falls through to app.js, which closes the WRITING face underneath and
       the one press jumps two levels. That is the bug `__backDone` below was
       written for, arriving on a third face. */
    if (!slot) return;
    if (slot.classList.contains('is-boxing')) {
      var bx = slot.querySelector('.tr.boxes');
      if (bx) bx.click();
      e.__backDone = 1;
      return;
    }
    if (!slot.classList.contains('is-agent')) return;
    var f = slot.querySelector('.tray .face');
    if (f) f.click();
    /* AND THE OTHER HANDLER MUST NOT UNDO IT. app.js listens for this same
       cell to close a writing face, and on a slot that is both asking and in
       the agent this one leaves the agent, that one then closed the box
       underneath - the arrow jumping two levels in one press. Whichever runs
       first claims the press. */
    e.__backDone = 1;
  });

  /* TABBING BETWEEN THE TWO. A radio group again, the same one the modes and
     the presets are, because picking a face is the same kind of choice. */
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.tray .face');
    if (!b) return;
    var slot = b.closest('.slot');
    if (!slot) return;
    b.classList.remove('is-new');
    var agent = slot.classList.toggle('is-agent');
    /* THE PICTURE FOLLOWS THE FACE. app.js owns the plate because it owns
       the writing box; this handler owns which face is up, so it says so
       rather than watching for it. */
    if (window.HJ && window.HJ.facePlate) window.HJ.facePlate(slot, agent);
    var other = b.dataset.back;
    b.dataset.back = b.textContent;
    b.textContent = other;
    /* the header is the face you are on, the cell is the one you are not */
    var k = slot.querySelector('.tray .tray-k');
    /* THE HEADER IS THE FACE YOU ARE ON, and stepping out of the agent on a
       writing slot lands on the one it was helping you write - which is
       called PROMPT, both on the cell that opens it and now on the header. */
    /* AND THE WAY BACK LANDS ON THE NAME THAT FACE ACTUALLY HAS, which is
       PROMPT everywhere now: 04's panel said DIRECTION at rest, and that is
       the slot's name rather than the face's. */
    /* AND THE AGENT HEADER IS ONE COLOUR - Babe, 2026-10-26: "idk if i want
       the bold agent header". It was lifted on 01 and plain on 04 because
       one wrote the word through `faceHead` (which marks the face with a
       `b`) and the other wrote it as text; marking it everywhere made all
       three match and Babe's eye said the wrong way. So the lift comes off
       the agent face instead, which is the same call as "i think SINGLE SHOT
       PROMPT header should be the same color" - an address is read in one
       go. 06's CHARACTER and LOCATION keep theirs: that is a face you chose,
       not one you stepped into. */
    if (slot.classList.contains('writes') && window.HJ && window.HJ.faceHead) {
      window.HJ.faceHead(slot, agent ? 'Agent' : 'Prompt');
    } else if (k) k.textContent = agent ? 'Agent' : (slot.dataset.face0 || 'Prompt');
    /* AND `face0` IS THE WHOLE ANSWER NOW. This used to check `has-form`
       first, because `faceHome` wrote face0 for every door on 04 and then
       overrode the header itself with DIRECTION - two writers for one line,
       which is how the agent could come back to a name the panel does not
       use. One name, written in one place. */
    if (agent) { var f = slot.querySelector('.compose-in'); if (f) f.focus(); }
  });

  /* SENDING PUTS THE LINE IN THE TRANSCRIPT AND CLEARS THE ROW, and Enter
     sends it, because that is what typing in a message box means everywhere
     else. NOTHING ANSWERS YET: the agent behind this is still to be built, so
     the panel keeps what you said rather than faking a reply to it. */
  function turn(log, who, text, cls) {
    var k = document.createElement('div');
    k.className = 'msg-k' + (who === 'Agent' ? ' bot' : '');
    k.textContent = who;
    var m = document.createElement('div');
    m.className = 'msg' + (cls ? ' ' + cls : '');
    if (text) m.textContent = text;
    log.appendChild(k);
    log.appendChild(m);
    log.scrollTop = log.scrollHeight;
    return m;
  }

  function sendLine(slot) {
    var f = slot.querySelector('.compose-in');
    var log = slot.querySelector('.helper-log');
    if (!f || !log || slot.classList.contains('is-waiting')) return;
    var said = f.textContent.trim();
    if (!said) return;
    turn(log, 'You', said);
    f.innerHTML = '';
    ask(slot, log);
  }

  /* AND THE SWEEP ABOVE THE TRAY DOES NOT RUN - Babe, 2026-10-29: "i dont
     really want that red line animation just the flashing agent box". It did,
     on the argument that the 2px bar is one vocabulary for waiting and the
     agent asking a model something is a job out. THE ARGUMENT IS RIGHT ABOUT
     A JOB AND WRONG ABOUT WHERE YOU ARE LOOKING: the chip is inside the panel
     you just typed into, an inch from the cursor, and the bar is on the
     slot's bottom seam saying the same thing somewhere you are not. Two marks
     for one wait, and the quieter one is better placed.
     SO THE SLOT IS `is-waiting` AND NOT `is-working` - the first is what
     stops a second send and marks the chip, the second is what lights
     `.slot-prog`. They were added together and only one of them was for
     this. */
  function ask(slot, log) {
    var pending = turn(log, 'Agent', '', 'pending');
    /* the chip IS the waiting mark now, so it is marked rather than a bar */
    var chip = pending.previousElementSibling;
    if (chip) chip.classList.add('is-waiting');
    var f = slot.querySelector('.compose-in');
    slot.classList.add('is-waiting');
    if (f) {
      f.dataset.phHeld = f.dataset.ph || '';
      f.dataset.ph = 'Waiting…';
      f.contentEditable = 'false';
    }

    /* A DIRECTION TURNS RUN ON. Anything else - a question back, a refusal,
       the not-connected line below - leaves it dark, because the cell means
       "run what it just wrote" and there has to be something it just wrote. */
    function answered(text, direction) {
      slot.classList.remove('is-waiting');
      if (f) {
        f.dataset.ph = f.dataset.phHeld || '';
        f.contentEditable = 'true';
      }
      pending.classList.remove('pending');
      if (chip) chip.classList.remove('is-waiting');
      pending.textContent = text;
      log.scrollTop = log.scrollHeight;

      if (direction) {
        /* WHICHEVER BOX THIS SLOT WRITES IN. 04 composes into `.say`; a
           `writes` slot's box is the `.ask` it was opened on, and that is
           what the rung's RUN reads. */
        /* AND ON A FORM SLOT IT HAS TO LAND SOMEWHERE VISIBLE. `.say` is
           hidden on every tab that has a form, because there the form is the
           sentence - so a proposal written into it was a line you could only
           read in the transcript and could not edit at all. The agent wrote
           it, so the box becomes the artist's: the free tab is pressed and
           the line is in it.
           NOT ON 04, AND THE BOARD IS WHY. There the mode is the JOB - it
           picks the layout the board is drawn to - so moving the tab to take
           a sentence would quietly turn a six-panel board into a freestyle
           one. On 05 the mode picks the form and nothing else, which is the
           same distinction every rule on these two slots now asks about. */
        /* AND IT LANDS IN THE FORM'S OWN BOX WHERE THE FORM HAS ONE. Babe,
           2026-10-28, watching 05 flip to CUSTOM the moment the agent
           answered: "05 full goes from motion agent to custom... i think that
           is wrong", "seems like it should stay on the motion tab". It was
           right that the line has to land somewhere VISIBLE and `.say` is
           hidden behind a form - and wrong about where visible is. A form
           whose first field is the thing to write already HAS that box, so
           the proposal goes into ACTION and the tab does not move; the mode
           you asked the question in is the mode you get the answer in.
           THE TAB SWITCH STAYS AS THE FALLBACK, for a form with nothing to
           write in - and for 04, which the board box excludes above, because
           there the mode is the JOB and moving it would turn a six-panel
           board into a freestyle one.
           `composeDirection` writes `.say` from the fields, so the line below
           the panel ends up reading `Action: <the timeline>` - the form
           describing itself, which is what that line is for. */
        var landed = false;
        if (slot.classList.contains('has-form') && !slot.querySelector('.boardbox')) {
          var mine = slot.querySelector('.form[data-form="' + slot.dataset.mode + '"]');
          var into = mine && mine.querySelector('.tf[data-f="action"]');
          if (into) {
            into.textContent = direction;
            composeDirection(slot);
            landed = true;
          } else {
            var free = null;
            slot.querySelectorAll('.ftabs .ftab').forEach(function (t) {
              if (!free && !slot.querySelector('.form[data-form="' + t.dataset.mode + '"]')) free = t;
            });
            if (free && free.getAttribute('aria-pressed') !== 'true') free.click();
          }
        }
        if (!landed) {
          var say = slot.querySelector('.say') || slot.querySelector('.ask');
          if (say) { say.textContent = direction; say.dataset.by = 'agent'; }
        }
        armRun(slot);
        /* AND THE TRANSCRIPT SHOWS WHAT IT WROTE - Babe, 2026-10-26: "we need
           a way to direct people back to prompt... since it doesnt look like
           it did anything. maybe theres a view prompt or it displays in the
           agent chat as well?". The line went into a box on the other face,
           so from in here the answer was a sentence about a sentence you
           cannot see.
           IT IS A NOTE, NOT A TURN. Nobody said it - it is the panel showing
           you what just landed somewhere else - so it is marked `note` and
           `transcript()` skips it, or the model would read its own proposal
           back as a second thing it said. */
        var k = document.createElement('div');
        k.className = 'msg-k note';
        /* just PROMPT - Babe, 2026-10-26. The line under it IS the prompt,
           so the heading only has to name it, the way AGENT and YOU do. */
        k.textContent = 'Prompt';
        var m = document.createElement('div');
        m.className = 'msg wrote';
        m.textContent = direction;
        log.appendChild(k);
        log.appendChild(m);
        log.scrollTop = log.scrollHeight;
        /* and the way back to it is marked until you take it */
        var face = slot.querySelector('.tray .tr.face');
        if (face) face.classList.add('is-new');
      }
    }

    /* AND NOW SOMETHING IS BEHIND IT. `HJ.agentAsk` lives in app.js, which
       owns every fetch on this page; this file binds to its own elements and
       calls the one seam it left for itself.
       THE NOT-CONNECTED LINE STAYS as the answer when there is no hook -
       mockup.html opens off disk with no server behind it, and a panel that
       pulses forever there would be worse than one that says so. */
    var hook = window.HJ && window.HJ.agentAsk;
    if (!hook) {
      setTimeout(function () {
        answered('Not connected yet - nothing read that. The panel is built; the agent behind it is still to come.');
      }, 1100);
      return;
    }
    hook(slot, log).then(function (r) {
      answered(r.say, r.prompt);
    }).catch(function (err) {
      answered(String(err && err.message || err));
    });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.compose [data-act="send"]');
    if (b) sendLine(b.closest('.slot'));
  });

  /* contenteditable leaves a stray <br> behind when you clear it by hand,
     and :empty stops matching, so the placeholder would never come back. */
  /* RUN LIGHTS WHEN THERE IS A DIRECTION TO RUN, and it does not care who
     wrote it. The agent filling the box and the artist typing into it are the
     same event as far as the cell is concerned: there are words, so there is
     something to send. */
  function armRun(slot) {
    if (!slot) return;
    var go = slot.querySelector('.tray .tr[data-act="agentrun"]');
    var say = slot.querySelector('.say');
    if (!go || !say) return;
    var ready = !!say.textContent.trim();
    go.disabled = !ready;
    go.classList.toggle('is-live', ready);
  }

  /* THE FORM WRITES THE DIRECTION, and the direction box is still the one
     thing anything downstream reads. The form is its editor rather than a
     second source of truth: compose on every change and nothing else on the
     rail has to learn that this rung has fields. */
  function composeDirection(slot) {
    if (!slot) return;
    /* CUSTOM IS THE ARTIST WRITING IT THEMSELVES, so nothing is composed on
       either side of the panel and the line below stays as they left it. */
    /* AND THE LINE STILL FOLLOWS THE TAB HERE. This returned before writing
       it, so pressing CUSTOM left whichever stem you were last on sitting
       under a box that no longer composes anything - the page describing a
       mode you had left. Nothing is composed FROM on this tab; the line is
       still a readout of which tab you are on, and `motionLine` keeps
       honouring a line the artist has made theirs. */
    var form = slot.querySelector('.form[data-form="' + slot.dataset.mode + '"]');
    var say = slot.querySelector('.say');
    /* AND THE TEST IS WHETHER THIS MODE HAS A FORM, not whether it is spelled
       `custom`. 05's free tab is the same face under its own key, and a
       literal here would have been the fourth place that one word was
       written down. The class is the same fact for the stylesheet, which
       cannot ask whether a form exists for the mode the slot is wearing. */
    slot.classList.toggle('no-form', !form);
    if (!form) { motionLine(slot, []); return armRun(slot); }
    if (!say) return;
    var lines = [], bits = [];
    form.querySelectorAll('.tf, .dial').forEach(function (el) {
      var dial = el.classList.contains('dial');
      var val = dial ? el.querySelector('.tr b').textContent : el.textContent.trim();
      /* AUTO IS NOT AN ANSWER, it is the absence of one, so it says nothing */
      if (!val || val === 'Auto') return;
      lines.push(el.dataset.n + ': ' + val + '.');
      /* AND ONLY THE WRITTEN FIELD GETS A CHIP - Babe, 2026-10-29: "i think
         we dont need the action framing lens light in red tho. just action".
         A chip is a name standing in for a value, and on this rung the line
         never travels - `runBoard` composes from the direction box - so the
         four of them were four red words naming the form directly above
         them. ACTION is the one that is a SENTENCE; the dials are choices
         the panel already shows, and the row reads as the shot rather than
         as a list of fields. They are still in `lines`, so what the model
         is sent has not moved. */
      if (!dial) bits.push({ k: el.dataset.f, n: el.dataset.n });
    });
    say.textContent = lines.join(' ');
    motionLine(slot, bits);
    armRun(slot);
  }

  /* ONE PASS, TWO READERS. The board is drawn from what the form holds and
     the clip is driven by it too, so the facts are gathered once and dressed
     twice - the server already keeps a scaffolding per step, which is where
     the difference between a layout instruction and a motion one belongs.
     AND ONCE YOU HAVE TOUCHED THE LINE IT IS YOURS. The artist gets the last
     word, so the form stops writing over a sentence somebody edited; clearing
     it back to empty hands it back to the form, which is the only way out
     that does not need a second button to explain it. */
  /* THE HEADER SAYS WHERE IT TAKES YOU. With a board showing it offers the
     form; while you are back in the form it says what will redraw the board,
     which is the same thing the header says before the first draw. */
  /* THE TWO CELLS ARE A RADIO PAIR, and pressing one is the whole of what
     happens: `is-editing` is which face is up and the pressed cell is the
     one thing on screen that says so. */
  document.addEventListener('click', function (e) {
    var p = e.target.closest && e.target.closest('.tray .pick-face');
    if (!p) return;
    var slot = p.closest('.slot');
    if (!slot) return;
    slot.querySelectorAll('.pick-face').forEach(function (o) {
      o.setAttribute('aria-pressed', String(o === p));
    });
    var writing = p.dataset.face === 'prompt';
    boardPlate(slot, writing);
    slot.classList.toggle('is-editing', writing);
    /* GOING INTO THE PROMPT IS GOING IN. The board is the slot at rest - it
       is what this rung made - and the writing face is a place you step into,
       where the row becomes its own and the agent is a cell in it. */
    slot.classList.toggle('is-inface', writing);
    if (writing && window.HJ.faceHead) window.HJ.faceHead(slot, 'Prompt');
  });

  /* THE BOARD FOLLOWS THE FACE. It is a child of the box it is shown in,
     so the writing face has to be handed it rather than given a copy - the
     same move `facePlate` makes between a slot's picture and its agent. */
  function boardPlate(slot, toWriter) {
    var box = slot.querySelector('.boardbox');
    var writer = slot.querySelector('.writer');
    if (!box || !writer) return;
    var from = toWriter ? box : writer, to = toWriter ? writer : box;
    var plate = from.querySelector(':scope > img');
    if (plate) to.appendChild(plate);
  }

  function boardHead(slot, editing) {
    var k = slot.querySelector('.tray .tray-k');
    if (!k) return;
    /* AND THE CELLS FOLLOW WHATEVER PUT THE FACE UP, because a board arrives
       from a run, from `S` and from a reload, and all three have to leave the
       row agreeing with the box. */
    slot.querySelectorAll('.pick-face').forEach(function (o) {
      o.setAttribute('aria-pressed', String((o.dataset.face === 'prompt') === !!editing));
    });
    boardPlate(slot, !!editing);
    /* NO LABEL, JUST THE CHEVRON AND THE NAME - Babe, 2026-10-25: "remove the
       word model : and add the <". MODEL was naming a field in a row that has
       no other fields, and the chevron is what the nested panels used to mean
       "there is a way back through here". The name is the content; the mark
       says it is a control. */
    /* IT NAMES THE PANEL, NOT A MODEL. While the board was drawn from a cell
       in here, the header said which model that cell would run - the rule
       every writing face follows. The rung's own row names it now, and a
       second name on the same screen can only disagree with it: the row has
       a picker and this was a literal. */
    k.textContent = 'Prompt';
  }

  function motionLine(slot, bits) {
    var slide = slot.closest('.slide');
    var line = slide && slide.querySelector('.agent-v');
    if (!line || line.dataset.by === 'artist') return;
    var stem = MOTION[slot.dataset.mode];
    if (!stem) return;
    /* THE LINE OPENS BY SAYING WHAT KIND OF SHOT IT IS - Babe, 2026-10-25:
       "it could start with SINGLE SHOT. something something. ACTION". The tab
       is the first decision on the rung and the sentence was starting one
       clause after it, so the line now reads in the order the panel does.
       IT RESOLVES TO NOTHING, and that is correct rather than a shortcut: the
       mode travels in the payload as `mode`, picking the graph and the board
       layout, so spending words on it would be telling the model something
       the job already says. No form field answers to it, which is exactly the
       condition motionText skips on. */
    var name = slot.dataset.mode;
    for (var m = 0; m < SHOTMODES.length; m++) {
      if (SHOTMODES[m].k === slot.dataset.mode) name = SHOTMODES[m].n;
    }
    var h = '<b class="tok" contenteditable="false" data-tok="mode" data-n="Mode">' +
            name.toUpperCase() + '</b>. ' + stem;
    for (var i = 0; i < (bits || []).length; i++) {
      h += ' <b class="tok" contenteditable="false" data-tok="' + bits[i].k +
           '" data-n="' + bits[i].n + '">' + bits[i].n.toUpperCase() + '</b>';
    }
    line.innerHTML = h;
  }

  /* WHAT THE LINE MEANS, RATHER THAN WHAT IT SHOWS. A chip is a name standing
     in for a field, so the sentence that goes to the model is built by walking
     the line and putting each field's value back where its chip sits - read
     live, so a chip is never holding a value the form has since changed. Text
     the artist typed around the chips comes through exactly as typed, which is
     what keeps the last word theirs even on a line they did not start. */
  function motionText(slide) {
    var line = slide && slide.querySelector('.agent-v');
    if (!line) return '';
    var slot = slide.querySelector('.slot.has-form');
    var form = slot && slot.querySelector('.form[data-form="' + slot.dataset.mode + '"]');
    var out = [];
    for (var i = 0; i < line.childNodes.length; i++) {
      var node = line.childNodes[i];
      var key = node.dataset && node.dataset.tok;
      /* PLAIN TEXT ON THIS LINE IS THE ARTIST'S AND TRAVELS; ANYTHING IN A
         TAG IS THE PAGE'S OWN FURNITURE AND DOES NOT. A text node has no
         dataset at all, which is the whole test - so 04's stems still go to
         the model and 01's lead stays on the screen it was written for. */
      if (!node.dataset) { out.push(node.textContent); continue; }
      if (!key) continue;
      var el = form && (form.querySelector('[data-f="' + key + '"]') ||
                        form.querySelector('.dial[data-k="' + key + '"]'));
      if (!el) continue;
      var val = el.classList.contains('dial')
        ? el.querySelector('.tr b').textContent
        : el.textContent.trim();
      if (val && val !== 'Auto') out.push(node.dataset.n + ': ' + val + '.');
    }
    /* A CHIP THAT RESOLVES TO NOTHING LEAVES ITS PUNCTUATION BEHIND, and the
       mode chip is deliberately one of those - so every prompt composed from
       one of these lines was arriving at the model starting with a full
       stop. 04's too. */
    return out.join(' ').replace(/\s+/g, ' ').trim().replace(/^[.,;:\s]+/, '');
  }

  document.addEventListener('input', function (e) {
    var ff = e.target.closest && e.target.closest('.form .tf');
    if (ff) {
      if (!ff.textContent.trim()) ff.innerHTML = '';
      composeDirection(ff.closest('.slot'));
      return;
    }

    /* `.ask` IS IN HERE SO IT CAN EMPTY ALL THE WAY. A contenteditable left
       holding a <br> is not `:empty`, and `:empty` is what holds RUN cold
       while the box that feeds it has nothing in it. */
    var f = e.target.closest && e.target.closest('.compose-in, .say, .ask');
    if (!f) return;
    if (!f.textContent.trim()) f.innerHTML = '';
    if (f.classList.contains('say')) {

      [q('.nav .ck', document), fade, 300, 60],
      /* THE FILM STRIP ARRIVES JUST BEFORE THE ARROWS - Babe, 2026-10-27:
         "can we add the media icon to the cascade, right before the arrows
         at the top right". It was the one control in the bar not in the
         opening at all, so it was simply there from the first frame while
         everything around it assembled. The bar reads left to right - the
         lockup, the nav, then the right end - and this sits at the head of
         that last group. */
      /* THE PAIR ARRIVES AS A PAIR - Babe, 2026-10-27: "can you cascade the
         new key box with the media one". The key was simply there from the
         first frame, which is what the film strip itself was until it joined
         this cascade. They share a seam now, so they share a group: one line,
         and a 70ms stagger across it the way the arrows had, so the strip
         draws left to right rather than switching on. */
      [q('.bar-glyphs > button', document), fade, 760, 70],
      [q('.arrows .ar-btn', document), fade, 820, 70]

    /* THE ROOM ARRIVES BY THE INK LIFTING, NOT BY THE PLATE FADING - Babe,
       2026-10-28: "it looks just bright in general. maybe dimming the end
       state would help more too", "ink over it 0.60", then the move that
       made it one thing: "can we just animate that value?", "1.00 to .60",
       "ease".
       IT IS A BETTER MECHANISM AND NOT ONLY A NICER LOOK. Fading the plane's
       opacity means the room arrives in whatever state the PICTURE is in -
       and on a cold cache the picture is not there yet, which is the stall
       Babe could see and could not place: measured, a cold load climbed, sat
       for a second, then climbed again as the image landed, and the same take
       run twice was clean. `--void-scrim` is flat ink over the plate, so it
       covers the room whether or not the room has decoded, and lifting it
       reveals whatever is underneath by then. One value, one ramp, no
       dependence on the network.

       camera: anime writes a unit onto a bare number often enough that the
       safe form is to tween an object and set the property by hand.

       same rule the groups follow by reading `__op` off the element. */

              easing: 'easeInOutSine',
              update: function () { root.style.setProperty('--void-scrim', ink.v); } });
    } else {
      root.style.setProperty('--void-scrim', voidScrim);
    }

       target is already at zero, so the page never shows its finished state
       for a frame on the way in. */
    groups.forEach(function (g) {
      g[0].forEach(function (el) {
        /* WHAT WAS THERE BEFORE, so tidy can put it back instead of blanking
           it. Some of these elements own an inline transform and it is not
           decoration - see the note on tidy below. */
        el.__tf = el.style.transform;
        /* AND WHAT IT RESTS AT, WHICH IS NOT ALWAYS 1 - Babe, 2026-10-27, on
           the numeral: "its solid at first and then drops down". The cascade
           animated every target to full and `tidy` then handed it back to
           the stylesheet, so anything with a resting opacity below 1 arrived
           solid and snapped down a frame later. The numeral is the first
           element on this page to have one, and it will not be the last, so
           the fade ends where the element actually lives rather than at a 1
           written into the animation. Read BEFORE the inline 0 below, or the
           computed value is the thing we just set.
           AND AFTER THE TRANSITION IS OFF, WHICH COST A ROOM - Babe,
           2026-10-29: "when i refresh i start to see it in the background but
           it disappears". `getComputedStyle` returns the value a property has
           RIGHT NOW, and at boot these are all mid-flight: the page paints
           with 01 active and `restoreJourney` jumps to wherever you left off,
           so every plane is a second into `--plane-fade` when this runs.
           Measured: `__op` came back 0.998406 for FIVE plates at once -
           the same number for the active slide, the two behind it that rest
           at 1 and the two ahead that rest at 0. So the rooms ahead of you
           were animated up to full, held there for about a second, and then
           eased back down to nothing by the stylesheet - which is exactly
           what a room appearing and disappearing on a refresh looks like.
           SWITCHING THE TRANSITION OFF FIRST CANCELS IT, so the read is of
           where the element LIVES rather than where it happens to be passing.
           `HJ.cascade` has had these two in this order since it was lent out;
           this is the same mechanism written twice with only one of them
           right, which is the shape this file keeps paying for. */
        el.__tr = el.style.transition;
        el.style.transition = 'none';
        el.__op = getComputedStyle(el).opacity;
        /* AND THE STYLESHEET MUST NOT SMOOTH A FADE ANIME IS DRIVING - Babe,
           2026-10-27: "its literally the first thing you see then it fades
           out a bit and then back on". Measured on a replay: the plate went
           1 -> .875 -> .560 -> .514, sat there for a second and a half, then
           climbed back. It never reached zero.
           `.plane` declares `transition: opacity var(--plane-fade)` - 1300ms,
           which exists so a slide you travel away from dims over the length
           of a travel. So setting the inline 0 did not HIDE the plate, it
           asked the browser to ease it down over 1300ms, while anime was
           already easing the same property up from the value it found. Two
           animations on one property, meeting in the middle.
           THE TRANSITION IS BORROWED AND GIVEN BACK, like the transform and
           the opacity beside it: off while the cascade owns the property, and
           restored by `tidy` so the travel's own fade still works. It is
           switched off above, before the read. */
        el.style.opacity = 0;
      });
    });
    body.classList.remove('intro');

    /* NO LEFTOVER INLINE STYLE, AND ON THIS PAGE THAT IS LOAD-BEARING RATHER
       THAN TIDY. An inline transform makes an element a containing block, and
       the model menu is absolutely positioned against .model-wrap while the
       result panel is positioned against .slide - the same class of bug this
       file already records twice, where a transformed ancestor broke
       `position: fixed` and a filter flattened preserve-3d. Inline opacity
       is just as sharp: `.cost` is hidden by a :has() rule while the model
       menu is open, and an inline 1 would beat it forever. */
    var tidy = function (a) {
      a.animatables.forEach(function (x) {
        /* RESTORE, DO NOT BLANK. dwarp can blank these because nothing there
           owns an inline transform. On this page apply() writes one onto
           every .plane and that transform IS the depth, so blanking the
           plate's drew the room untransformed, at full size, in front of the
           headline - and it stayed wrong until the next travel, because
           apply() runs on travel rather than every frame.
           Babe, 2026-10-25: "the background is covering the text now",
           "should be in the background".
           A check for "no leftover inline styles" called that a pass, which
           is the wrong question. The right one is whether every element ends
           up with the inline style it started with. */
        x.target.style.transform = x.target.__tf || '';
        x.target.style.opacity = '';
        x.target.style.transition = x.target.__tr || '';
      });
      /* AND A PLANE GETS ITS TRANSFORM FROM apply(), NOT FROM A SNAPSHOT OF
         apply(). Restoring rather than blanking was right and still is - but
         what it hands back is the string that was there when the cascade
         STARTED, and on this page the rail moves in between: the boot lays
         out at slide 01, the cascade saves MID's transform for a camera at
         zero, app.js then restores the journey and jumps to the section you
         left, and this put the first one back on top of it. Only MID drifted,
         because `.cam` is not a target and kept the right offset, and only on
         a restored rail, which is why it read as "the ui is not aligned on
         the right as usual" and went away the moment you travelled.
         Measured, 2026-10-28: after a reload MID sat at translate(-628px)
         with camX at -12672 and the slide at left 12672 - an offset of
         exactly 5 pitches, which is the rail standing at 01.
         ONE MECHANISM PER FACT: the depth belongs to apply() and a saved copy
         of it is a second place for it to live. The restore above still runs,
         for the slots and the prompt and RUN that have no other owner; this
         then overwrites every plane with the live value, in the same turn, so
         nothing is ever painted untransformed - which is the failure the note
         above this one is about. */
      apply();
    };
    /* AND IT IS COUNTED, NOT TIMED. The last group to finish is not the last
       group in the table - the durations and the stagger differ - so adding up
       delays here would be a second description of the animation that could
       disagree with it. Each group reports in and the final one speaks. */
    var pending = 0;
    groups.forEach(function (g) {
      if (!g[0].length) return;
      pending++;
      anime(Object.assign({ targets: g[0],
        opacity: function (el) { return el.__op; } }, g[1],
        { delay: anime.stagger(g[3], { start: g[2] }),
          complete: function (a) { tidy(a); if (--pending === 0) said(); } }));
    });
    if (!pending) said();
  }
  /* a slow or failed start still shows the page */
  setTimeout(intro, 2500);

  /* THE SAME CASCADE, LENT OUT TO A PANEL - Babe, 2026-10-27: "when you go to
     describe can we have the panel build from top to bottom using the cascade
     animejs effect". `intro` reveals a whole slide once per load; a face that
     opens mid-session wants the same move over a handful of rows, and what is
     worth sharing is not the easing - it is the discipline around it.

     HIDDEN FIRST, IN THE SAME TASK. The rows go to zero in the same turn of
     the event loop that reveals their panel, so the finished card is never
     painted for a frame on the way in. Nothing is deferred here for exactly
     that reason.

     AND IT RESTORES RATHER THAN BLANKS, which on this page is load-bearing
     rather than tidy: an inline transform makes an element a containing block
     and inline opacity beats a stylesheet rule forever. Every target gets back
     the inline style it arrived with - the lesson the plate taught `intro`
     when blanking one drew the room in front of the headline.

     WITHOUT anime.js IT SIMPLY DOES NOT RUN, and the panel appears as it
     always did. mockup.html opens off disk with no server behind it; a face
     that stayed invisible there would be worse than one that does not
     animate. */
  function cascade(els, opt) {
    var list = [].slice.call(els || []);
    if (!list.length || !window.anime) return;
    opt = opt || {};
    var rise = opt.rise === undefined ? 10 : opt.rise;
    list.forEach(function (el) {
      el.__tf = el.style.transform;
      /* AND THE TRANSITION IS BORROWED TOO, the way the transform and the
         opacity are. A stylesheet transition on a property anime is driving
         is two animations meeting in the middle - the plate paid for this
         once already - and here it smeared every step of the stagger into
         the next, so a grid of tiles carrying `transition: opacity .15s`
         read as one wash rather than a sweep. */
      el.__tr = el.style.transition;
      el.style.transition = 'none';
      /* the same read `intro` makes: a row that rests below 1 must not be
         animated up to full and dropped back by the restore. */
      el.__op = getComputedStyle(el).opacity;
      el.style.opacity = 0;
    });
    anime({
      targets: list,
      opacity: function (el) { return el.__op; },
      translateY: [rise, 0],
      duration: opt.duration || 460,
      easing: 'easeOutCubic',
      delay: anime.stagger(opt.stagger === undefined ? 55 : opt.stagger,
                           { start: opt.start || 0 }),
      complete: function (a) {
        a.animatables.forEach(function (x) {
          x.target.style.transform = x.target.__tf || '';
          x.target.style.opacity = '';
          x.target.style.transition = x.target.__tr || '';
        });
      }
    });
  }


  /* EVERY TUNED VALUE LIVED IN TWO PLACES, AND BAKING ONE OF THEM IS HOW THE
     PANEL ENDS UP LYING. A knob's number is a `var` in here and a literal in
     `:root`, and nothing ever pushed the first into the second - every
     `setProperty` sat inside a slider's own `input` handler. So the page
     booted on the stylesheet's numbers while the readouts showed the script's,
     and the two only met once you dragged something. A freshly baked set
     therefore looked like it had not taken: panel 6, page 14.
     THIS IS THE ONE PLACE NOW. It runs at boot, the sliders keep their own
     handlers for while you are dragging, and the `:root` values are a
     fallback that can no longer disagree - change the `var`, not the CSS. */
  function pushVars() {
    var set = function (k, v) { root.style.setProperty(k, v); };
    set('--bg-blur', bgBlur + 'px');
    set('--bg-op', bgOp);
    set('--void-zoom', voidZoom + '%');
    set('--void-past', (voidPast / 100).toFixed(2));
    set('--void-mask-x', voidMask + '%');
    set('--void-mask-y', voidOver + '%');
    set('--void-px', anchorX + '%');
    set('--void-py', anchorY + '%');
    set('--shard-x', shardX + '%');
    set('--vig', vig);
    set('--vig-in', vigIn + '%');
    set('--void-scrim', voidScrim);
    set('--void-dim', voidDim);
    set('--fx', fx);
    set('--off-blur', offBlur + 'px');
    set('--head-lh', headLh);
    /* THE NUMERAL AND THE HORIZON WERE MISSING FROM HERE, which is the same
       two-places-for-one-number that made the last bake look like it had not
       taken: the panel would have shown the new position while the page kept
       the stylesheet's, and the two would only have met once a slider moved.
       Every knob that writes a custom property belongs in this function. */
    set('--num-x', numX + '%');
    set('--num-y', numY + '%');
    set('--num-op', numOp / 100);
    set('--rule-y', ruleY + '%');
  }
  pushVars();


  /* ------------------------------------------------ stepping into a panel
     THE ROW CHANGES, SO THE ROW SHOULD BE SEEN TO CHANGE - Babe, 2026-10-25:
     "when i click on location... it just IMPORT pops right in its place", "we
     may need some sort of transition when changing nested panels". Going into
     a face swaps `IMPORT | CHARACTER | LOCATION` for `< LOCATION | IMPORT`
     in one frame, which reads as the row being replaced rather than as you
     having gone somewhere.

     IT IS HOOKED ON THE CLASS, NOT ON THE CLICKS. Six places across two files
     put a slot into a face or take it out - the pick cells and the header
     here, PROMPT and DESCRIBE in app.js, the agent panel and a drawn board -
     and wiring each one is six chances to forget the seventh. The face is
     always a class on `.slot`, so that is the one thing they share.

     DIRECTION IS WHICH WAY YOU WENT. Gaining a face class is stepping in and
     the new row arrives from the right; losing one is stepping back and it
     arrives from the left, the way the chevron in the header points. */
  var FACE_CLASSES = ['is-inface', 'is-asking', 'is-describing', 'is-agent', 'is-boxing', 'has-board'];

  function swapTray(slot, back) {
    var tray = slot.querySelector('.tray');
    if (!tray || !window.anime) return;
    var cells = [].slice.call(tray.children).filter(function (el) {
      return el.getClientRects().length;
    });
    if (!cells.length) return;
    anime.remove(cells);
    anime({
      targets: cells,
      opacity: [0, 1],
      translateX: [back ? -10 : 10, 0],
      duration: 260, easing: 'easeOutCubic',
      delay: anime.stagger(34, { from: back ? 'last' : 'first' }),
      /* the same restore the opening learned: put back what was there rather
         than blanking it, because an inline transform makes a containing
         block and these cells sit under the model menu's column. */
      complete: function (a) {
        a.animatables.forEach(function (x) {
          x.target.style.transform = '';
          x.target.style.opacity = '';
        });
      }
    });
  }

  (function watchFaces() {
    if (!window.MutationObserver) return;
    var faces = function (cl) {
      return FACE_CLASSES.filter(function (c) { return cl.indexOf(c) !== -1; }).length;
    };
    new MutationObserver(function (recs) {
      recs.forEach(function (r) {
        var el = r.target;
        if (!el.classList || !el.classList.contains('slot')) return;
        var was = faces(' ' + (r.oldValue || '') + ' ');
        var now = faces(' ' + el.className + ' ');
        /* only a step in or out - a slot gains and loses is-full, is-working
           and half a dozen others without the row changing at all. */
        if (was === now) return;
        swapTray(el, now < was);
      });
    }).observe(document.body, {
      subtree: true, attributes: true,
      attributeFilter: ['class'], attributeOldValue: true
    });
  })();

  /* app.js draws the full-size template from SHEETS and reads the typed
     traits, so both have to cross the seam - but nothing else does. */
  /* the rail is laid out by now, so every target has a box to be measured
     against and q() can tell what is actually on screen. */
  requestAnimationFrame(function () { requestAnimationFrame(function () { intro(); }); });

  /* THE ONE SEAM THE ? PANEL NEEDS, and it reads the strip rather than being
     handed a list: the tabs on screen are the modes this slot has, in the
     order they are drawn, so the panel cannot show a mode the row does not
     offer. The text is looked up in the mode tables by the key the tab
     already carries - `MODES` is read this way by the agent's board job for
     the same reason, that a second list here is a list that can disagree
     with the drawing. */
  function modeHelp(slot) {
    var tables = [MOVEMODES, STYLEMODES, SHOTMODES];
    var out = [];
    slot.querySelectorAll('.ftabs .ftab').forEach(function (tab) {
      var k = tab.dataset.mode;
      for (var i = 0; i < tables.length; i++) {
        if (!tables[i]) continue;
        for (var j = 0; j < tables[i].length; j++) {
          if (tables[i][j].k === k && tables[i][j].why) {
            out.push(tables[i][j]);
            return;
          }
        }
      }
    });
    return out;
  }

  /* ------------------------------------------------------------ THE BOXES
   *
   * Babe, 2026-10-29: "then we can explore a simple bounding box control
   * panel. maybe you can draw boxes on the image to be more specific".
   *
   * WHAT THE MODEL ACTUALLY WANTS is a caption, one space, then ONE JSON
   * array of rows {id, from, src_bbox, tgt_bbox, desc} - boxes as
   * [y_min, x_min, y_max, x_max], integers 0..1000, top-left origin, from
   * BFL's own `i2i_bbox` annotation prompt. So the panel's job is to produce
   * that table from a drag, and nothing here invents a format.
   *
   * AND NOTHING IS WIRED YET, DELIBERATELY. This draws, selects, describes
   * and deletes, and `HJ.boxTable()` reads the rows out - so the FEEL can be
   * judged before a single credit is spent on it. The run path does not know
   * this exists.
   *
   * THE PICTURE IS THE LEFT SLOT'S, WHICH IS THE ONE EXCEPTION TO THE PLATE
   * RULE. Every other face stands on the picture the box ITSELF is holding,
   * because you write over what the box holds. A box table is addressed to
   * `<ref_image_0>`, which on 01 is the SOURCE - the thing being edited -
   * so this face reaches across to the left slot for it.
   * AND IT IS CLONED RATHER THAN MOVED, which is the opposite of what
   * `facePlate` does and for the opposite reason: facePlate moves the node
   * because the box it comes from is being hidden anyway, and a re-made
   * <video> reloads. Here the left slot stays on screen holding that
   * picture, so moving it would blank the thing you are drawing on top of.
   * A still cloned twice cannot disagree with itself. */
  function leftPicOf(slot) {
    var slide = slot.closest('.slide');
    if (!slide) return null;
    /* IT WALKS `.inp` AND NOT `.drop`, which is the same thing `boxesOf`
       does and the reason that function exists: every slot is wrapped in one
       `.inp`, so the FIRST of them is the left slot however many faces it
       has. Walking `.drop` by position breaks the moment a left slot grows a
       second face, because the alt box sits between the two slots.
       AND IT DOES IT HERE RATHER THAN BORROWING `HJ.boxesOf`. The first
       draft asked app.js for the reader and silently got nothing when the
       answer was undefined - six lines that cannot be undefined beat one
       line that can.
       AND IT DRAWS ON WHICHEVER PICTURE IS THERE, LEFT FIRST. Measured in
       the page, 2026-10-29, after Babe said the image was gone three times:
       the SOURCE slot held nothing but its file input, and the picture they
       were looking at was in the RIGHT slot. The panel was right and right
       uselessly - it sent somebody hunting for a bug when there was a
       picture on screen it could have drawn on.
       SO THE LEFT IS PREFERRED AND THE RIGHT IS THE FALLBACK, which is also
       what the two mean to the model: the left is <ref_image_0>, the thing
       being edited, and the right is <ref_image_1>, the thing the
       instruction refers to - and `from` on every row says which, so a box
       drawn on the second reference is expressible rather than mislabelled.
       It is the rail's own rule arriving here too: you write over what the
       box is holding, and this face is the one that points at it. */
    var inps = slide.querySelectorAll('.inp');
    for (var i = 0; i < inps.length; i++) {
      var box = inps[i].querySelector('.drop:not(.alt)');
      var pic = box && box.querySelector('img, video');
      if (pic) return { el: pic, from: i === 0 ? 'ref_image_0' : 'ref_image_1' };
    }
    return null;
  }

  /* 0..1000, TOP-LEFT ORIGIN, AND MEASURED AGAINST THE PICTURE RATHER THAN
   * THE PANEL. `object-fit: contain` bars a non-square picture out inside a
   * square panel, so the bars are panel and not image - a box drawn over one
   * would come out as a coordinate outside the frame. This finds the drawn
   * rect of the image inside its box and maps into that. */
  function picRect(stage) {
    var img = stage.querySelector('.boxer-plate');
    var r = stage.getBoundingClientRect();
    var nw = img ? (img.naturalWidth || img.videoWidth || 0) : 0;
    var nh = img ? (img.naturalHeight || img.videoHeight || 0) : 0;
    if (!nw || !nh) return { x: 0, y: 0, w: r.width, h: r.height };
    var scale = Math.min(r.width / nw, r.height / nh);
    var w = nw * scale, h = nh * scale;
    return { x: (r.width - w) / 2, y: (r.height - h) / 2, w: w, h: h };
  }

  function clamp(n, lo, hi) { return n < lo ? lo : n > hi ? hi : n; }

  /* A RANDOM COLOUR PER BOX, AND IT IS THE BOX'S NAME. Babe, 2026-10-29:
     "a random color of your box selection... when you select and move around
     the box that color changes next to the prompt you add".
     IT IS A HUE AND NOT A PALETTE, because a palette runs out: the fifth box
     would repeat the first and two boxes with one name is the one thing the
     colour exists to prevent. Spun off the golden angle from a random start,
     so consecutive boxes are always far apart on the wheel rather than
     occasionally adjacent, which a plain random hue is about a fifth of the
     time.
     AND THE SATURATION AND LIGHTNESS ARE FIXED, high and bright: this page
     is near-black with one red in it, and a colour picked freely would
     sooner or later land on that red or disappear into the plate. */
  var bxHue = Math.random() * 360;
  function nextColour() {
    bxHue = (bxHue + 137.508) % 360;
    return 'hsl(' + Math.round(bxHue) + ' 85% 62%)';
  }

  /* THE ROW IS KEPT ON THE ELEMENT, NOT IN A LIST BESIDE IT. The boxes ARE
   * the state - one mechanism per fact - so there is nothing to keep in step
   * when one is deleted and nothing to rebuild when the panel re-opens. */
  function bboxOf(el, stage) {
    var p = picRect(stage);
    var x0 = parseFloat(el.style.left), y0 = parseFloat(el.style.top);
    var w = parseFloat(el.style.width), h = parseFloat(el.style.height);
    var k = function (v, off, span) {
      return Math.round(clamp((v - off) / (span || 1), 0, 1) * 1000);
    };
    return [k(y0, p.y, p.h), k(x0, p.x, p.w),
            k(y0 + h, p.y, p.h), k(x0 + w, p.x, p.w)];
  }

  function renumber(stage) {
    var all = stage.querySelectorAll('.bx');
    for (var i = 0; i < all.length; i++) {
      all[i].dataset.n = i + 1;
      var k = all[i].querySelector('.bx-k');
      if (k) k.textContent = i + 1;
    }
    var slot = stage.closest('.slot');
    if (slot) slot.classList.toggle('has-bx', all.length > 0);
  }

  function pickBox(stage, el) {
    var slot = stage.closest('.slot');
    var all = stage.querySelectorAll('.bx');
    for (var i = 0; i < all.length; i++) {
      all[i].setAttribute('aria-pressed', all[i] === el ? 'true' : 'false');
    }
    if (slot) slot.classList.toggle('has-pick', !!el);
    if (!slot) return;
    if (!el) {
      var bare = slot.querySelector('.boxer-say');
      if (bare) {
        bare.style.removeProperty('--bx-c');
        var bd = bare.querySelector('.boxer-desc');
        if (bd) bd.textContent = '';
      }
      return;
    }
    /* THE ROW IS THE AGENT'S COMPOSE ROW IN THE AGENT'S POSITION - inside
       the panel, at the foot, which is where this slot's other face already
       puts it. It sat outside for one draft, and a row that is a sibling of
       a square grows the column when it appears: selecting your first box
       would have moved the tray and RUN down the screen. The stage takes the
       remaining height instead, so nothing below the panel ever moves. */
    var say = slot.querySelector('.boxer-say');
    if (!say) return;
    say.style.setProperty('--bx-c', el.style.getPropertyValue('--bx-c'));
    var d = say.querySelector('.boxer-desc');
    d.textContent = el.dataset.desc || '';
    d.focus();
  }

  function addBox(stage, x, y, w, h) {
    var el = document.createElement('div');
    el.className = 'bx';
    el.setAttribute('aria-pressed', 'false');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.width = w + 'px'; el.style.height = h + 'px';
    /* THE COLOUR ARRIVES AS A CUSTOM PROPERTY, never as `border-color`. An
       inline style beats a stylesheet rule forever, so writing the stroke
       directly would make the selected state impossible to draw - the same
       lesson the collage shards paid for with `--op` and `--blr`. */
    el.style.setProperty('--bx-c', nextColour());
    el.innerHTML = '<span class="bx-k"></span>';
    stage.appendChild(el);
    renumber(stage);
    return el;
  }

  /* DRAWING. Pointer capture on the surface, so a drag that leaves the panel
   * still ends properly - the same reason the collage arranger takes the
   * pointer rather than watching the document. */
  document.addEventListener('pointerdown', function (e) {
    var surf = e.target.closest && e.target.closest('.boxer-draw');
    var hit = e.target.closest && e.target.closest('.bx');
    var stage = (surf || hit) && (surf || hit).closest('.boxer-stage');
    if (!stage) return;
    if (hit) { pickBox(stage, hit); return; }
    var owner = stage.closest('.slot');
    if (owner && !owner.classList.contains('has-pic')) return;
    var r = stage.getBoundingClientRect();
    var ox = e.clientX - r.left, oy = e.clientY - r.top;
    var el = null;
    surf.setPointerCapture(e.pointerId);
    var move = function (ev) {
      var cx = ev.clientX - r.left, cy = ev.clientY - r.top;
      var x = Math.min(ox, cx), y = Math.min(oy, cy);
      var w = Math.abs(cx - ox), h = Math.abs(cy - oy);
      /* A CLICK IS NOT A BOX. Under about eight pixels it is somebody
         putting the current one down, which is what the empty space is for. */
      if (!el && w < 8 && h < 8) return;
      if (!el) el = addBox(stage, x, y, w, h);
      el.style.left = x + 'px'; el.style.top = y + 'px';
      el.style.width = w + 'px'; el.style.height = h + 'px';
    };
    var up = function (ev) {
      surf.removeEventListener('pointermove', move);
      surf.removeEventListener('pointerup', up);
      try { surf.releasePointerCapture(ev.pointerId); } catch (err) {}
      pickBox(stage, el);
    };
    surf.addEventListener('pointermove', move);
    surf.addEventListener('pointerup', up);
    e.preventDefault();
  });

  /* THE BOX FACE AUTHORS THE RUNG'S SENTENCE, which is what lights RUN -
     Babe, 2026-10-29: "then we need the RUN to highlight red so you can run
     the bounding box edit".
     IT WRITES INTO THE WRITING BOX RATHER THAN INVENTING A SECOND ROUTE,
     which is exactly what the agent does with its proposal: there is one
     place the artist's line lives and one gate reading it, so a third face
     that produces a line puts it there and every rule downstream - the cold
     RUN, `valuesFor`, the carry - keeps working without being told this
     face exists.
     THE SENTENCE IS THE DESCRIPTIONS AND NOTHING ELSE. Each box cites its
     own id, which is the half BFL's annotator format needs from the
     paragraph; the coordinates ride in the table `HJ.boxTable` builds and
     never in here, because a sentence full of numbers is not a sentence
     anybody can take the last word on. */
  function boxSaid(slot) {
    var stage = slot.querySelector('.boxer-stage');
    if (!stage) return '';
    return [].slice.call(stage.querySelectorAll('.bx')).map(function (el) {
      var d = (el.dataset.desc || '').trim();
      return d ? d.replace(/[.;]\s*$/, '') + ' <region_' + el.dataset.n + '>' : '';
    }).filter(Boolean).join('; ');
  }

  function pushSaid(slot) {
    var line = boxSaid(slot);
    slot.dataset.boxSaid = line;
    /* `.ask` IS THE ONE THE GATE READS and the one `valuesFor` reads, so
       writing it is the whole wiring. The box's own memory is written too,
       because the words have to outlive a step back out of the face. */
    var ask = slot.querySelector('.ask');
    if (ask) ask.textContent = line;
    var drop = slot.querySelector('.drop');
    if (!drop) return;
    drop.dataset.said = line;
    /* AND A BOX DRAWN ON THIS SLOT'S OWN PICTURE KEEPS IT, which `data-keeps`
       already exists to say: one box one answer is the rule for words
       INSTEAD of a picture, and `.slot.writes.is-asking` drops the file for
       exactly that reason. A table of coordinates is the opposite case - the
       words are anchored TO the picture by position, which is as far from
       ambiguous as this rail gets - and without this the run would cite
       <ref_image_1> in the table while node 12 was dropped for having no
       reference: a prompt pointing at a picture that was never sent, which
       is the box-lying rule arriving in the face built to point at things.
       ONLY WHILE THERE ARE BOXES ON IT. Delete the last one and this is an
       ordinary writing slot again, so the flag goes with them. */
    var stage = slot.querySelector('.boxer-stage');
    var drawn = stage ? stage.querySelectorAll('.bx').length : 0;
    if (drawn && slot.dataset.bxFrom === 'ref_image_1') drop.dataset.keeps = '1';
    else delete drop.dataset.keeps;
  }

  document.addEventListener('input', function (e) {
    var d = e.target.closest && e.target.closest('.boxer-desc');
    if (!d) return;
    var owner = d.closest('.slot');
    var stage = owner && owner.querySelector('.boxer-stage');
    var el = stage && stage.querySelector('.bx[aria-pressed="true"]');
    if (el) el.dataset.desc = d.textContent.trim();
    if (owner) pushSaid(owner);
  });

  document.addEventListener('click', function (e) {
    var del = e.target.closest && e.target.closest('.bf-del');
    if (!del) return;
    var owner = del.closest('.slot');
    var stage = owner && owner.querySelector('.boxer-stage');
    var el = stage && stage.querySelector('.bx[aria-pressed="true"]');
    if (el) el.remove();
    renumber(stage);
    pickBox(stage, null);
    if (owner) pushSaid(owner);
  });

  /* STEPPING IN. The same shape as the agent cell beside it: one class on
     the slot, the header names the face, and the back arrow is the way out -
     which `closeAsk`'s handler already owns, so nothing here binds Escape or
     a second way back. */
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.tr.boxes');
    if (!b) return;
    var slot = b.closest('.slot');
    if (!slot) return;
    var panel = slot.querySelector('.boxer');
    if (!panel) return;
    var on = !slot.classList.contains('is-boxing');
    /* one face at a time - the agent and this cannot both be up */
    if (on && slot.classList.contains('is-agent')) {
      var face = slot.querySelector('.tray .face');
      if (face) face.click();
    }
    slot.classList.toggle('is-boxing', on);
    if (on) {
      var found = leftPicOf(slot);
      var src = found && found.el;
      slot.dataset.bxFrom = (found && found.from) || 'ref_image_0';
      var stage = panel.querySelector('.boxer-stage');
      var old = stage.querySelector('.boxer-plate');
      if (old) old.remove();
      if (src) {
        var clone = src.cloneNode(true);
        clone.className = 'boxer-plate';
        clone.removeAttribute('style');
        if (clone.tagName === 'VIDEO') { clone.muted = true; clone.defaultMuted = true; }
        stage.insertBefore(clone, stage.firstChild);
      }
      /* WHETHER THERE IS ANYTHING TO POINT AT, said once on the slot so the
         empty line, the cursor and the drag all read one fact. */
      slot.classList.toggle('has-pic', !!src);
      /* AND THE FRAME STARTS EMPTY. The row survives between openings, so a
         colour left on it is last session's box pointing at nothing. */
      var say0 = slot.querySelector('.boxer-say');
      if (say0) say0.style.removeProperty('--bx-c');
      renumber(stage);
    }
    var k = slot.querySelector('.tray .tray-k');
    if (window.HJ && window.HJ.faceHead) window.HJ.faceHead(slot, on ? 'Boxes' : 'Prompt');
    else if (k) k.textContent = on ? 'Boxes' : (slot.dataset.face0 || 'Prompt');
  });

  /* WHAT THE PANEL IS WORTH, read out in the shape it would be sent in.
     `from` is `ref_image_0` because on 01 the box is drawn on the SOURCE;
     `tgt_bbox` is the same box, since nothing here moves anything yet, and
     a row whose target is null is how a removal would be said. */
  function boxTable(slot) {
    slot = slot || document.querySelector('.slot.is-boxing');
    var stage = slot && slot.querySelector('.boxer-stage');
    if (!stage) return [];
    return [].slice.call(stage.querySelectorAll('.bx')).map(function (el) {
      var bb = bboxOf(el, stage);
      return {
        id: 'region_' + el.dataset.n,
        from: slot.dataset.bxFrom || 'ref_image_0',
        src_bbox: bb,
        tgt_bbox: bb,
        desc: el.dataset.desc || ''
      };
    });
  }

  window.HJ = { go: go, jump: jump, intro: intro, cascade: cascade, modeHelp: modeHelp,
    boxTable: boxTable, boxSaid: boxSaid,
                slides: slides, index: function () { return i; }, setVoid: setVoid,
                setShards: setShards,
                sheets: SHEETS, modes: MODES, traits: TRAITS, sheetTemplate: sheetTemplate,
                motionText: motionText, boardHead: boardHead,
                sheetSize: sheetSize };
})();
</script>
<script src="app.js"></script>
</body>
</html>
